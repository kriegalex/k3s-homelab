# Palworld Server Secrets Template
#
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Update the placeholders below with your desired passwords
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore (DO NOT COMMIT)
#
# NOTE: These are game server passwords, players will need them to connect

---
apiVersion: v1
kind: Secret
metadata:
  name: palworld-server-credentials
  namespace: game-servers
type: Opaque
stringData:
  # Admin password for server management (RCON)
  # Used by the Docker container as ADMIN_PASSWORD environment variable
  ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"

  # Server password that players use to connect
  # Leave empty ("") for public server, or set a password for private server
  # Used by the Docker container as SERVER_PASSWORD environment variable
  SERVER_PASSWORD: "CHANGE_ME_SERVER_PASSWORD"
