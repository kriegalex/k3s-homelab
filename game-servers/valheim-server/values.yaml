# valheim-server — chart: valheim-server v1.3.0.
# Real deployed values (source of truth for `helm upgrade -f values.yaml`).
# The server password lives in the manually created Secret referenced by
# `server.existingSecret` (shape: secrets-template.yaml — key server-password):
#   helm upgrade --install valheim-server k8s-charts/valheim-server \
#     --version 1.3.0 -n game-servers -f values.yaml
automation:
  autoBackup: 1
  autoBackupSchedule: '*/30 * * * *'
persistence:
  backups:
    size: 20Gi
  saves:
    size: 5Gi
resources:
  limits:
    cpu: 3000m
    memory: 8Gi
  requests:
    cpu: 1500m
    memory: 4Gi
server:
  existingSecret: valheim-server-credentials
  name: Ste ApoLAN Valheim
  public: 1
  world: steapolan
