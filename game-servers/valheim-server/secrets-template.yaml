# Template for the valheim-server credentials Secret (referenced by
# `server.existingSecret` in values.yaml). The real Secret is created
# manually — never commit the real password (Valheim requires >= 5 chars):
#
#   kubectl create secret generic valheim-server-credentials \
#     -n game-servers --from-literal=server-password='CHANGE_ME'
#
apiVersion: v1
kind: Secret
metadata:
  name: valheim-server-credentials
  namespace: game-servers
type: Opaque
stringData:
  server-password: CHANGE_ME
