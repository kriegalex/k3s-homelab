# Template for the enshrouded-server credentials Secret (referenced by
# `enshrouded.existingSecret` in values.yaml). The real Secret is created
# manually — never commit the real password:
#
#   kubectl create secret generic enshrouded-server-credentials \
#     -n game-servers --from-literal=SERVER_PASSWORD='CHANGE_ME'
#
apiVersion: v1
kind: Secret
metadata:
  name: enshrouded-server-credentials
  namespace: game-servers
type: Opaque
stringData:
  SERVER_PASSWORD: CHANGE_ME
