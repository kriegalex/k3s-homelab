# enshrouded-server — chart: enshrouded-server v1.1.0.
# Real deployed values (source of truth for `helm upgrade -f values.yaml`).
# The server password lives in the manually created Secret referenced by
# `existingSecret` (shape: secrets-template.yaml — key SERVER_PASSWORD):
#   helm upgrade --install enshrouded-server k8s-charts/enshrouded-server \
#     --version 1.1.0 -n game-servers -f values.yaml
enshrouded:
  existingSecret: enshrouded-server-credentials
  maxPlayers: 8
  serverName: Ste ApoLAN Server
persistence:
  enabled: true
  size: 10Gi
resources:
  limits:
    cpu: 3000m
    memory: 8Gi
  requests:
    cpu: 1500m
    memory: 4Gi
