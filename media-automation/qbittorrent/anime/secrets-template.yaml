# QBittorrent VPN Secrets Template (v2.0.0 Compatible)
#
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Replace the WireGuard configuration OR PIA credentials with your actual values
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore (DO NOT COMMIT)
#
# Get your WireGuard config from ProtonVPN:
# https://protonvpn.com/support/wireguard-configurations

---
# Option 1: WireGuard VPN Secret (for ProtonVPN, Mullvad, or custom WireGuard)
# Use this with: vpn.wireguard.enabled=true and vpn.wireguard.existingSecret=qbittorrent-vpn-config
apiVersion: v1
kind: Secret
metadata:
  name: qbit-anime-vpn-config
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/component: vpn
type: Opaque
stringData:
  # The key MUST be "wg0.conf" (or match vpn.wireguard.secretKey in values)
  wg0.conf: |
    [Interface]
    # Your WireGuard private key (keep this secret!)
    PrivateKey = YOUR_PRIVATE_KEY_HERE
    # Your VPN-assigned IP address
    Address = YOUR_VPN_ADDRESS/32
    # DNS server provided by VPN
    DNS = YOUR_DNS_SERVER

    [Peer]
    # VPN server's public key
    PublicKey = PEER_PUBLIC_KEY_HERE
    # Route all traffic through VPN
    AllowedIPs = 0.0.0.0/0
    # VPN server endpoint (IP:port)
    Endpoint = YOUR_VPN_ENDPOINT:51820

---
# Option 2: PIA VPN Credentials Secret
# Use this with: vpn.pia.enabled=true and vpn.pia.existingSecret=vpn-pia-credentials
apiVersion: v1
kind: Secret
metadata:
  name: vpn-pia-credentials
  namespace: media
  labels:
    app.kubernetes.io/name: qbittorrent
    app.kubernetes.io/component: vpn
type: Opaque
stringData:
  # These key names must match vpn.pia.existingKeys in your values file
  # Default key names: pia-user and pia-password
  pia-user: "YOUR_PIA_USERNAME"
  pia-password: "YOUR_PIA_PASSWORD"

---
# IMPORTANT NOTES:
#
# 1. Only apply ONE of the above secrets (either WireGuard OR PIA, not both)
#
# 2. For WireGuard (ProtonVPN):
#    - Download wg0.conf from ProtonVPN dashboard
#    - Copy the entire file content to the wg0.conf field above
#    - Ensure the key name is exactly "wg0.conf"
#
# 3. For PIA:
#    - Use your PIA username and password
#    - Key names default to "pia-user" and "pia-password"
#    - Can be customized via vpn.pia.existingKeys in values
#
# 4. Security best practices:
#    - NEVER commit secrets.yaml to git
#    - Use sealed-secrets or external-secrets in production
#    - Rotate VPN credentials regularly
#    - Limit namespace access to this secret
#
# 5. Alternative creation methods:
#
#    From file (WireGuard):
#    kubectl create secret generic qbittorrent-vpn-config \
#      --from-file=wg0.conf=/path/to/wg0.conf \
#      --namespace=media
#
#    From literals (PIA):
#    kubectl create secret generic vpn-pia-credentials \
#      --from-literal=pia-user='YOUR_USERNAME' \
#      --from-literal=pia-password='YOUR_PASSWORD' \
#      --namespace=media
