# qBittorrent on k8s-charts/qbittorrent >= 3.0.0.
#
# The chart's defaults already cover the libtorrent-v2 migration:
#   - image tag pinned to release-5.2.0 in Chart.yaml
#   - env.LIBTORRENT defaults to v2
#   - qbittorrentConf init container is enabled by default and seeds
#     the three keys that defuse the libtorrent-v2 mmap memory growth
#     (DiskIOType=3, MemoryWorkingSetLimit=4096, UseOSCache=false).
#
# Everything below is genuine homelab-specific override.

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-worker4
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 90
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - plex-media-server
          namespace: plex
          topologyKey: kubernetes.io/hostname

env:
  PGID: 1000
  PUID: 1000
  TZ: Etc/UTC
  UMASK: 2
  PRIVOXY_ENABLED: false
  UNBOUND_ENABLED: false
  VPN_AUTO_PORT_FORWARD: true
  VPN_CONF: wg0
  VPN_FIREWALL_TYPE: auto
  VPN_HEALTHCHECK_ENABLED: false
  VPN_KEEP_LOCAL_DNS: false
  VPN_LAN_LEAK_ENABLED: false
  VPN_LAN_NETWORK: 192.168.1.0/24
  WEBUI_PORTS: 8080/tcp,8080/udp

ingress:
  className: traefik
  enabled: true
  hosts:
    - host: torrent.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

persistence:
  config:
    enabled: true
    existingClaim: qbittorrent-config
  data:
    enabled: true
    existingClaim: nfs-torrent

# Hard memory cap = qbittorrentConf MemoryWorkingSetLimit (4096 MiB)
# plus headroom for the Qt/WebUI process and VPN sidecars.
resources:
  limits:
    cpu: 1
    memory: 6Gi
  requests:
    cpu: 250m
    memory: 1Gi

service:
  port: 8080
  type: ClusterIP

vpn:
  pia:
    enabled: false
  wireguard:
    enabled: true
    proton: true
    existingSecret: qbittorrent-vpn-config
    secretKey: wg0.conf
    config: ""
