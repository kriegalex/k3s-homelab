# Deploy-time overrides for the clonarr chart (k8s-charts/clonarr).
# Values are at root level (bjw-s common library format).

controllers:
  clonarr:
    containers:
      app:
        image:
          repository: ghcr.io/prophetse7en/clonarr
          pullPolicy: Always
          tag: latest
        env:
          TZ: Europe/Paris
          PORT: "6060"
          # Lock the UI to the homelab subnet + ingress reverse proxy.
          # TRUSTED_NETWORKS: "10.0.0.0/8,192.168.0.0/16"
          # TRUSTED_PROXIES: ""

service:
  app:
    controller: clonarr
    ports:
      http:
        port: 80
        targetPort: 6060

ingress:
  app:
    enabled: true
    className: traefik
    annotations: {}
    hosts:
      - host: clonarr.k3s.home
        paths:
          - path: /
            pathType: Prefix
            service:
              identifier: app
              port: http

persistence:
  config:
    type: persistentVolumeClaim
    existingClaim: clonarr
    globalMounts:
      - path: /config

defaultPodOptions:
  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k3s-worker3
    podAntiAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 80
          podAffinityTerm:
            labelSelector:
              matchExpressions:
                - key: app.kubernetes.io/name
                  operator: In
                  values:
                    - plex-media-server
            namespaces:
              - plex
            topologyKey: kubernetes.io/hostname
