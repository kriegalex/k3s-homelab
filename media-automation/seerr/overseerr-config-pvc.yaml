# PVC name kept as `overseerr-config` to preserve the existing Longhorn volume
# and avoid a data copy during the Overseerr → Seerr migration.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: overseerr-config
  namespace: media
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 5Gi
