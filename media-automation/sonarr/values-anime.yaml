# sonarr-anime — chart: alekc/sonarr v1.8.5. Real deployed values (source of truth).
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/hotio/sonarr
  tag: release-4.0.20.3014
ingress:
  className: traefik
  enabled: true
  hosts:
  - host: sonarr-anime.k3s.home
    paths:
    - path: /
      pathType: Prefix
persistence:
  accessMode: ReadWriteOnce
  additionalMounts:
  - mountPath: /data
    name: data
  additionalVolumes:
  - name: data
    persistentVolumeClaim:
      claimName: nfs-data-anime
  enabled: true
  existingClaim: sonarr-anime
resources:
  limits:
    cpu: 1000m
    memory: 8Gi
  requests:
    cpu: 100m
    memory: 1Gi
service:
  port: 80
  type: ClusterIP
