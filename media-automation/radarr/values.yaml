# radarr — chart: alekc/radarr v2.1.0. Real deployed values (source of truth).
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - preference:
        matchExpressions:
        - key: kubernetes.io/hostname
          operator: In
          values:
          - k3s-worker3
      weight: 100
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - plex-media-server
        namespaces:
        - plex
        topologyKey: kubernetes.io/hostname
      weight: 80
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/hotio/radarr
  tag: release-6.3.0.10514
ingress:
  className: traefik
  enabled: true
  hosts:
  - host: radarr.k3s.home
    paths:
    - path: /
      pathType: Prefix
persistence:
  accessMode: ReadWriteOnce
  additionalMounts:
  - mountPath: /data
    name: data
  additionalVolumes:
  - name: data
    persistentVolumeClaim:
      claimName: nfs-data
  enabled: true
  existingClaim: radarr
resources:
  limits:
    cpu: 500m
    memory: 4Gi
  requests:
    cpu: 100m
    memory: 1Gi
service:
  port: 80
  type: ClusterIP
