# radarr — chart: alekc/radarr v2.1.0. Real deployed values (source of truth).
image:
  pullPolicy: IfNotPresent
  repository: ghcr.io/hotio/radarr
  tag: release-6.4.4.10685
ingress:
  className: traefik
  enabled: true
  hosts:
  - host: radarr.k3s.home
    paths:
    - path: /
      pathType: Prefix
persistence:
  accessMode: ReadWriteOnce
  additionalMounts:
  - mountPath: /data
    name: data
  additionalVolumes:
  - name: data
    persistentVolumeClaim:
      claimName: nfs-data
  enabled: true
  existingClaim: radarr
resources:
  limits:
    cpu: 500m
    memory: 4Gi
  requests:
    cpu: 100m
    memory: 1Gi
service:
  port: 80
  type: ClusterIP
