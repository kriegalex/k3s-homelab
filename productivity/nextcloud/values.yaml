## ref: https://hub.docker.com/r/library/nextcloud/tags/
##
image:
  repository: nextcloud
  flavor: fpm
  tag: 32.0.5-fpm
  pullPolicy: IfNotPresent

# Number of replicas to be deployed
replicaCount: 1

## Allowing use of ingress controllers
## ref: https://kubernetes.io/docs/concepts/services-networking/ingress/
##
ingress:
  enabled: true
  className: traefik
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    # See ingress/traefik/middlewares/nextcloud.yaml for definitions:
    #   - wellknown-dav      301 /.well-known/{card,cal}dav -> /remote.php/dav/
    #   - wellknown-rewrite  rewrite /.well-known/{webfinger,nodeinfo,host-meta,host-meta.json}
    #                          -> /index.php/.well-known/...
    #   - security-headers   strip Server / X-Powered-By
    #   - cors               CORS for cloud.lourenco.ch (WebDAV verbs included)
    # Body size: Traefik streams request bodies by default with no cap, which is
    # what Nextcloud chunked uploads need; PHP enforces upload_max_filesize /
    # post_max_size internally. Do NOT add a Buffering middleware (Traefik #12407).
    traefik.ingress.kubernetes.io/router.middlewares: "nextcloud-nextcloud-wellknown-dav@kubernetescrd,nextcloud-nextcloud-wellknown-rewrite@kubernetescrd,nextcloud-nextcloud-security-headers@kubernetescrd,nextcloud-nextcloud-cors@kubernetescrd"
  tls:
  - hosts:
    - cloud.homelab.example.com
    secretName: nextcloud-tls
  path: /
  pathType: Prefix

phpClientHttpsFix:
  enabled: true
  protocol: https

nextcloud:
  host: cloud.homelab.example.com
  ## Use an existing secret
  existingSecret:
    enabled: true
    secretName: nextcloud-admin-credentials
    usernameKey: nextcloud-username
    passwordKey: nextcloud-password
  trustedDomains:
    - cloud.homelab.example.com
  extraEnv:
  - name: TRUSTED_PROXIES
    value: 10.42.0.0/16

nginx:
  ## You need to set an fpm version of the image for nextcloud if you want to use nginx!
  enabled: true

internalDatabase:
  enabled: false
  name: nextcloud

##
## External database configuration
##
externalDatabase:
  enabled: true
  type: postgresql
  host: nextcloud-db-rw
  # user: nextcloud
  database: nextcloud
  existingSecret:
    enabled: true
    secretName: nextcloud-db-credentials
    usernameKey: db-username
    passwordKey: db-password

##
## PostgreSQL chart configuration
## for more options see https://github.com/bitnami/charts/tree/main/bitnami/postgresql
##
postgresql:
  enabled: false
  # global:
  #   postgresql:
  #     auth:
  #       username: nextcloud
  #       password: Nextcloud1988_DB
  #       database: nextcloud
  # primary:
  #   persistence:
  #     enabled: true
  #     size: 10Gi
  #     storageClass: longhorn-single-replica
  # affinity:
