  #     preferredDuringSchedulingIgnoredDuringExecution:
  #     - podAffinityTerm:
  #         labelSelector:
  #           matchExpressions:
  #           - key: app.kubernetes.io/instance
  #             operator: In
  #             values:
  #             - nextcloud
  #         topologyKey: kubernetes.io/hostname
  #       weight: 80

##
## Redis chart configuration
## for more options see https://github.com/bitnami/charts/tree/main/bitnami/redis
##
redis:
  enabled: true
  architecture: standalone
  auth:
    enabled: true
    existingSecret: nextcloud-redis-credentials
    existingSecretPasswordKey: redis-password
  master:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 200m
        memory: 256Mi
    affinity:
      podAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
        - podAffinityTerm:
            labelSelector:
              matchExpressions:
              - key: app.kubernetes.io/instance
                operator: In
                values:
                - nextcloud
            topologyKey: kubernetes.io/hostname
          weight: 80
    persistence:
      enabled: true
      storageClass: longhorn-single-replica

##
## Collabora chart configuration
## for more options see https://github.com/CollaboraOnline/online/tree/master/kubernetes/helm/collabora-online
##
collabora:
  enabled: true
  collabora:
    aliasgroups:
    - host: https://cloud.homelab.example.com:443
    extra_params: --o:ssl.enable=false --o:ssl.termination=true
    server_name: collabora.homelab.example.com
    username: admin
    existingSecret:
      enabled: true
      secretName: "nextcloud-collabora-credentials"
      passwordKey: "password"
  ingress:
    enabled: true
    className: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      # Traefik defaults stream request bodies (no proxy-body-size needed) and
      # use long-lived upstream connections. If WOPI long polls hit a timeout,
      # attach the long-timeout-600 ServersTransport (see
      # ingress/traefik/middlewares/collabora-timeout.yaml) to the collabora
      # Service via:
      #   traefik.ingress.kubernetes.io/service.serverstransport: nextcloud-long-timeout-600@kubernetescrd
      # nginx upstream-hash-by ($arg_WOPISrc) sticky sessions are not currently
      # replicated — Collabora has been running fine without them.
    hosts:
    - host: collabora.homelab.example.com
      paths:
      - path: /
        pathType: ImplementationSpecific
    tls:
    - hosts:
      - collabora.homelab.example.com
      secretName: nextcloud-collabora-tls
  resources:
    requests:
      cpu: 100m
      memory: 1Gi
    limits:
      cpu: 500m
      memory: 2Gi
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/instance
              operator: In
              values:
              - nextcloud
          topologyKey: kubernetes.io/hostname
        weight: 80

cronjob:
  enabled: true

service:
  type: ClusterIP
  port: 8080

## Enable persistence using Persistent Volume Claims
## ref: https://kubernetes.io/docs/concepts/storage/persistent-volumes/
##
persistence:
  enabled: true
  existingClaim: nextcloud-config
  nextcloudData:
    enabled: true
    existingClaim: nfs-nextcloud

resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 2000m
    memory: 2Gi

livenessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
readinessProbe:
  enabled: true
  initialDelaySeconds: 10
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3
  successThreshold: 1
startupProbe:
  enabled: false

affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-worker4
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - plex-media-server
        topologyKey: kubernetes.io/hostname
      weight: 80

## Prometheus Exporter / Metrics
##
metrics:
  enabled: false
