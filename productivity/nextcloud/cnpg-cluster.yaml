apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nextcloud-db
  namespace: nextcloud
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:16.8

  # Disable botocore flexible checksums so backups keep working if this image is
  # ever bumped to botocore >=1.36 (the QNAP swift3 S3 gateway rejects the new
  # x-amz-checksum-crc32 with InvalidDigest). See database/cloudnative-pg/README.md.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required

  storage:
    storageClass: longhorn-single-replica
    size: 25Gi

  resources:
    requests:
      memory: 512Mi
      cpu: 150m
    limits:
      memory: 1Gi
      cpu: 500m

  backup:
    retentionPolicy: "30d"
    target: prefer-standby
    barmanObjectStore:
      destinationPath: "s3://nextcloud-backups/"
      endpointURL: "http://10.0.0.7:8010"
      s3Credentials:
        accessKeyId:
          name: nextcloud-s3-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: nextcloud-s3-backup-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: bzip2
      data:
        compression: bzip2

  bootstrap:
    initdb:
      database: nextcloud
      owner: nextcloud
      secret:
        name: nextcloud-db-credentials
  
  monitoring:
    enablePodMonitor: true
