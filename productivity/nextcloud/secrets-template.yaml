# Nextcloud Secrets Template
#
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Generate secure passwords and update the placeholders below
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore (DO NOT COMMIT)
#
# Generate secure passwords:
#   openssl rand -base64 32

---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-admin-credentials
  namespace: nextcloud
type: Opaque
stringData:
  nextcloud-username: "admin"
  nextcloud-password: "CHANGE_ME_ADMIN_PASSWORD"  # Use: openssl rand -base64 32

---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-db-credentials
  namespace: nextcloud
type: Opaque
stringData:
  db-username: "nextcloud"
  db-password: "CHANGE_ME_DB_PASSWORD"  # Use: openssl rand -base64 32

---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-redis-credentials
  namespace: nextcloud
type: Opaque
stringData:
  redis-password: "CHANGE_ME_REDIS_PASSWORD"  # Use: openssl rand -base64 32

---
apiVersion: v1
kind: Secret
metadata:
  name: nextcloud-collabora-credentials
  namespace: nextcloud
type: Opaque
stringData:
  username: "admin"
  password: "CHANGE_ME_COLLABORA_PASSWORD"  # Use: openssl rand -base64 32
