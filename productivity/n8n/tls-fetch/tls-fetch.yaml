---
# tls-fetch — a tiny in-cluster HTTP proxy that fetches TLS-fingerprint-walled pages
# (DataDome/Akamai JA3 blocks) on behalf of n8n, using curl_cffi's Chrome impersonation.
#
# Why it exists: the apartment-monitor (n8n `appart-bulle`) receives portal alert e-mails
# whose listing links point at Comparis/homegate/etc. Those detail pages 403 a plain HTTP
# client at the TLS layer, but curl_cffi(impersonate=chrome) clears them (verified: Comparis
# dispatcher link 403 via curl, 200 via curl_cffi → full __NEXT_DATA__ JSON with description,
# amenities, GPS, photos, and the listing agency). n8n's HTTP Request node can't spoof TLS,
# so it GETs this service instead: GET /fetch?url=<listing-url> → {status, final_url, body}.
#
# Design notes:
# - Registry-less homelab → no custom image build. Stock python:3.12-slim + a ConfigMap-
#   mounted server + `pip install --target` at startup (PyPI egress from ns n8n is open).
#   curl_cffi is PINNED; bump it periodically as Chrome TLS profiles rotate (see README).
# - Cluster-internal only (ClusterIP, no Ingress). In-app host allowlist (ALLOWED_HOSTS)
#   blocks SSRF to internal/metadata endpoints — this proxy only reaches real-estate portals.
# - Non-root, readOnlyRootFilesystem; writable emptyDirs for the pip target and /tmp.
apiVersion: v1
kind: ConfigMap
metadata:
  name: tls-fetch-src
  namespace: n8n
data:
  server.py: |
    import ipaddress
    import json
    import os
    import socket
    from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer
    from urllib.parse import urlparse, parse_qs

    from curl_cffi import requests

    ALLOWED = tuple(
        h.strip().lower()
        for h in os.environ.get("ALLOWED_HOSTS", "").split(",")
        if h.strip()
    )
    DEFAULT_IMPERSONATE = os.environ.get("IMPERSONATE", "chrome")
    TIMEOUT = int(os.environ.get("FETCH_TIMEOUT", "25"))
    MAX_BYTES = int(os.environ.get("MAX_BYTES", "3000000"))
    # Mail click-trackers (e.g. SendGrid in homegate alerts) whose links must be
    # resolved to the real portal URL before the DataDome cookie is applied.
    REDIRECTORS = tuple(
        h.strip().lower()
        for h in os.environ.get("REDIRECTOR_HOSTS", "sendgrid.net").split(",")
        if h.strip()
    )

    def host_allowed(host):
        host = (host or "").lower()
        return any(host == s or host.endswith("." + s) for s in ALLOWED)

    def resolves_to_public(host):
        # Block SSRF to private / link-local / loopback ranges even if a portal
        # domain were ever pointed at one.
        try:
            infos = socket.getaddrinfo(host, None)
        except OSError:
            return False
        for info in infos:
            ip = ipaddress.ip_address(info[4][0])
            if ip.is_private or ip.is_loopback or ip.is_link_local or ip.is_reserved:
                return False
        return True

    class Handler(BaseHTTPRequestHandler):
        protocol_version = "HTTP/1.1"

        def _reply(self, code, obj):
            body = json.dumps(obj).encode("utf-8")
            self.send_response(code)
            self.send_header("Content-Type", "application/json; charset=utf-8")
            self.send_header("Content-Length", str(len(body)))
            self.end_headers()
            self.wfile.write(body)

        def log_message(self, *args):
            pass  # quiet; k8s logs would otherwise get one line per health probe

        def do_GET(self):
            parsed = urlparse(self.path)
            if parsed.path == "/healthz":
                return self._reply(200, {"ok": True})
            if parsed.path != "/fetch":
                return self._reply(404, {"error": "not found"})

            q = parse_qs(parsed.query)
            target = (q.get("url") or [""])[0]
            if not target:
                return self._reply(400, {"error": "missing url"})
            tu = urlparse(target)
            if tu.scheme not in ("http", "https"):
                return self._reply(400, {"error": "bad scheme"})
            host = (tu.hostname or "")
            if not host_allowed(host):
                return self._reply(403, {"error": "host not allowed", "host": host})
            if not resolves_to_public(host):
                return self._reply(403, {"error": "host resolves to non-public address"})

            impersonate = (q.get("impersonate") or [DEFAULT_IMPERSONATE])[0]

            # Optional DataDome session replay (immoscout24 / homegate / SMG pool):
            # caller supplies a solved `datadome` cookie + the matching browser
            # User-Agent via request headers (kept out of the URL so the token isn't
            # logged). curl_cffi already presents a Chrome TLS fingerprint; cookie +
            # UA + same egress IP as the browser that solved the challenge satisfy
            # DataDome and unlock live listing/search pages. Absent → plain fetch
            # (unchanged behaviour for Comparis etc. that only need TLS impersonation).
            ua = self.headers.get("X-DD-UA") or (q.get("ua") or [""])[0]
            dd_cookie = self.headers.get("X-DD-Cookie") or (q.get("cookie") or [""])[0]
            req_headers = {"User-Agent": ua} if ua else {}
            req_cookies = {"datadome": dd_cookie} if dd_cookie else {}

            # If the target is a mail click-tracker (SendGrid in homegate alerts), resolve
            # its redirect(s) to the real portal URL FIRST. We follow hop-by-hop via the
            # Location header (allow_redirects=False) WITHOUT the cookie, so we never fetch
            # the portal un-authenticated — i.e. no cookie-less 403 that would ding the
            # home IP's DataDome reputation. Only a resolved host that is itself in
            # ALLOWED_HOSTS (a known portal) is then fetched, with the cookie, below.
            def _is_redirector(h):
                h = (h or "").lower()
                return any(h == s or h.endswith("." + s) for s in REDIRECTORS)

            if _is_redirector(host):
                hop = target
                resolved = None
                for _ in range(5):
                    try:
                        rr = requests.get(hop, impersonate=impersonate, headers=req_headers,
                                          allow_redirects=False, timeout=TIMEOUT)
                    except Exception as exc:  # noqa: BLE001
                        return self._reply(200, {"status": 0, "error": "resolve failed",
                                                 "detail": str(exc)[:200]})
                    loc = rr.headers.get("location")
                    if not loc:
                        break
                    if loc.startswith("/"):
                        from urllib.parse import urljoin
                        loc = urljoin(hop, loc)
                    if _is_redirector(urlparse(loc).hostname or ""):
                        hop = loc
                        continue
                    resolved = loc.split("#")[0].split("?")[0]
                    break
                if not resolved:
                    return self._reply(200, {"status": 0, "error": "unresolved redirector",
                                             "final_url": hop})
                rhost = urlparse(resolved).hostname or ""
                if not host_allowed(rhost) or not resolves_to_public(rhost):
                    return self._reply(200, {"status": 0, "error": "resolved host not allowed",
                                             "final_url": resolved})
                target = resolved

            try:
                r = requests.get(
                    target,
                    impersonate=impersonate,
                    headers=req_headers,
                    cookies=req_cookies,
                    timeout=TIMEOUT,
                    allow_redirects=True,
                )
            except Exception as exc:  # noqa: BLE001 - report any fetch failure to caller
                return self._reply(502, {"error": "fetch failed", "detail": str(exc)[:300]})

            # DataDome rolls the token on every response — surface the refreshed
            # value so the caller can persist it and keep the session alive.
            try:
                refreshed_dd = r.cookies.get("datadome")
            except Exception:  # noqa: BLE001
                refreshed_dd = None

            text = r.text or ""
            truncated = len(text) > MAX_BYTES
            if truncated:
                text = text[:MAX_BYTES]
            return self._reply(200, {
                "status": r.status_code,
                "final_url": str(r.url),
                "content_type": r.headers.get("content-type", ""),
                "truncated": truncated,
                "datadome": refreshed_dd,
                "body": text,
            })

    if __name__ == "__main__":
        ThreadingHTTPServer(("0.0.0.0", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tls-fetch
  namespace: n8n
  labels: { app: tls-fetch }
spec:
  replicas: 1
  selector:
    matchLabels: { app: tls-fetch }
  template:
    metadata:
      labels: { app: tls-fetch }
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: tls-fetch
          image: python:3.12-slim
          # Install curl_cffi into a writable emptyDir at startup (registry-less homelab),
          # then run the ConfigMap-mounted server. Pin the version; bump per README.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              pip install --no-cache-dir --target=/pylibs "curl_cffi==0.15.0"
              exec python /app/server.py
          env:
            - { name: PYTHONPATH, value: "/pylibs" }
            - { name: HOME, value: "/tmp" }
            - { name: PIP_DISABLE_PIP_VERSION_CHECK, value: "1" }
            # Portal hosts we fetch, plus mail click-trackers (REDIRECTOR_HOSTS) whose
            # links are resolved to a portal URL before the cookie is applied. A resolved
            # redirect is only fetched if its final host is also in this list.
            - name: ALLOWED_HOSTS
              value: "comparis.ch,homegate.ch,immoscout24.ch,newhome.ch,immobilier.ch,petitesannonces.ch,gerofinance.ch,gruyere-immo.ch,sallin-immobilier.ch,flatfox.ch,anibis.ch,sendgrid.net"
            - name: REDIRECTOR_HOSTS
              value: "sendgrid.net"
          ports:
            - { name: http, containerPort: 8080 }
          startupProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
            failureThreshold: 30   # ~150s budget for the pip install on first boot
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 30
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: "50m", memory: "128Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
          volumeMounts:
            - { name: src, mountPath: /app }
            - { name: pylibs, mountPath: /pylibs }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: src
          configMap: { name: tls-fetch-src }
        - name: pylibs
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tls-fetch
  namespace: n8n
  labels: { app: tls-fetch }
spec:
  selector: { app: tls-fetch }
  ports:
    - { name: http, port: 8080, targetPort: http }
