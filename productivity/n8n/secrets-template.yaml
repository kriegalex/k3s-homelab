---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-secrets
  namespace: n8n  # Updated to match n8n namespace
type: Opaque
data:
  # Generate a secure encryption key with: openssl rand -base64 32
  # Then base64 encode it again for k8s secret: echo -n "your-key-here" | base64
  encryption-key: "CHANGEMEaUlRb3JLUkk3eG1yeVBkWWpHeDlFWmdkdEtvTkdzenpIL0tEbz0K"

# Example of how to generate and apply the secret:
# 1. Generate encryption key: openssl rand -base64 32
# 2. Base64 encode for k8s: echo -n "generated-key" | base64  
# 3. Replace the encryption-key value above
# 4. Apply: kubectl apply -f n8n-secrets.yaml
---
apiVersion: v1
kind: Secret
metadata:
  name: n8n-db-credentials
  namespace: n8n
type: Opaque
stringData:
  username: n8n
  password: "CHANGE_ME_DB_PASSWORD"
---
# Optional: Only needed if you're using the backup configuration
apiVersion: v1
kind: Secret
metadata:
  name: n8n-db-backup-credentials
  namespace: n8n
type: Opaque
data:
  ACCESS_KEY_ID: "CHANGE_ME_KEY_ID"
  ACCESS_SECRET_KEY: "CHANGE_ME_SECRET_KEY"
