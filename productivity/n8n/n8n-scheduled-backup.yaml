---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: n8n-scheduled-backup
  namespace: n8n
spec:
  schedule: "0 14 0 ? * MON"
  backupOwnerReference: self
  cluster:
    name: n8n-db
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
