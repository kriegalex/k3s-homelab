apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: n8n-db
  namespace: n8n
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised
  # Pinned to the live webhook-defaulted image (was unpinned; the operator default
  # can jump majors on upgrade, so pin explicitly like the other clusters).
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5

  # Disable botocore flexible checksums. botocore >=1.36 (image 17.5 ships 1.40.x)
  # attaches x-amz-checksum-crc32 to every PUT/UploadPart, which the QNAP swift3
  # S3 gateway rejects with InvalidDigest -> WAL archiving + backups fail.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required

  # PostgreSQL configuration
  postgresql:
    parameters:
      shared_buffers: 256MB
      max_connections: "100"
      
  # Storage configuration
  storage:
    storageClass: longhorn-single-replica
    size: 20Gi
    
  # Resources configuration
  resources:
    requests:
      memory: 512Mi
      cpu: 150m
    limits:
      memory: 1Gi
      cpu: 500m
      
  # WAL archiving + base backups via plugin-barman-cloud (in-tree barmanObjectStore
  # removed in CNPG 1.31). Store config: n8n-objectstore.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: n8n-backup-store


  # Database initialization
  bootstrap:
    initdb:
      database: n8n
      owner: n8n
      secret:
        name: n8n-db-credentials

  # Extra roles reconciled by the operator (databases are declared via Database CRs,
  # e.g. apartments-database.yaml)
  managed:
    roles:
      - name: apartments
        ensure: present
        login: true
        passwordSecret:
          name: apartments-db-credentials

  monitoring:
    enablePodMonitor: true
