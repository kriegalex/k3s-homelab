apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: event-manager-postgres
  namespace: n8n
spec:
  affinity:
    podAntiAffinityType: preferred
  bootstrap:
    initdb:
      database: n8n_telegram_bot
      owner: n8n_user
      secret:
        name: event-manager-postgres-secret
  imageName: ghcr.io/cloudnative-pg/postgresql:17.5
  instances: 3
  # Disable botocore flexible checksums (botocore >=1.36); the QNAP swift3 S3
  # gateway rejects x-amz-checksum-crc32 with InvalidDigest, breaking backups.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required
  monitoring:
    enablePodMonitor: true
  postgresql:
    parameters:
      shared_buffers: 128MB
  resources:
    limits:
      cpu: 500m
      memory: 512Mi
    requests:
      cpu: 250m
      memory: 256Mi
  storage:
    size: 8Gi
    storageClass: longhorn-single-replica
  # WAL archiving + base backups via plugin-barman-cloud (in-tree barmanObjectStore
  # removed in CNPG 1.31). Store config: event-manager-objectstore.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: event-manager-backup-store
