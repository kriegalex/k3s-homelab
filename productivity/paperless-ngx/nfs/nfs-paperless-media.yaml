---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nfs-paperless-media
spec:
  storageClassName: ""
  capacity:
    storage: 100Gi
  accessModes:
    - ReadWriteMany
  nfs:
    server: 10.0.0.2
    path: "/mnt/user/paperless/media"
  mountOptions:
    - nfsvers=4.2
    - hard
    - noatime
    - timeo=600
    - retrans=2
    - noresvport
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: nfs-paperless-media
  namespace: paperless
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: ""
  resources:
    requests:
      storage: 100Gi
  volumeName: nfs-paperless-media
