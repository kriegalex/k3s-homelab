apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: paperless
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  # Disable botocore flexible checksums so backups keep working if this image is
  # ever bumped to botocore >=1.36 (the QNAP swift3 S3 gateway rejects the new
  # x-amz-checksum-crc32 with InvalidDigest). See database/cloudnative-pg/README.md.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required

  storage:
    storageClass: longhorn-single-replica
    size: 10Gi

  resources:
    requests:
      memory: 150Mi
      cpu: 150m
    limits:
      memory: 500Mi
      cpu: 300m

  backup:
    retentionPolicy: "30d"
    target: prefer-standby
    barmanObjectStore:
      destinationPath: "s3://paperless-backups/"
      endpointURL: "http://10.0.0.7:8010"
      s3Credentials:
        accessKeyId:
          name: paperless-s3-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: paperless-s3-backup-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: bzip2
      data:
        compression: bzip2

  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-db-credentials

  monitoring:
    enablePodMonitor: true
