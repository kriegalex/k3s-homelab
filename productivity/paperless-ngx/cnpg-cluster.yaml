apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: paperless-db
  namespace: paperless
spec:
  instances: 3
  imageName: ghcr.io/cloudnative-pg/postgresql:17.2

  # Disable botocore flexible checksums so backups keep working if this image is
  # ever bumped to botocore >=1.36 (the QNAP swift3 S3 gateway rejects the new
  # x-amz-checksum-crc32 with InvalidDigest). See database/cloudnative-pg/README.md.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required

  storage:
    storageClass: longhorn-single-replica
    size: 10Gi

  resources:
    requests:
      memory: 150Mi
      cpu: 150m
    limits:
      memory: 500Mi
      cpu: 300m

  # WAL archiving + base backups via plugin-barman-cloud (in-tree barmanObjectStore
  # removed in CNPG 1.31). Store config: paperless-objectstore.yaml; the old
  # backup.target: prefer-standby moved to the ScheduledBackup.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: paperless-backup-store

  bootstrap:
    initdb:
      database: paperless
      owner: paperless
      secret:
        name: paperless-db-credentials

  monitoring:
    enablePodMonitor: true
