# Paperless-NGX Secrets Template
#
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Generate secure passwords and update the placeholders below
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore (DO NOT COMMIT)
#
# Generate secure passwords:
#   openssl rand -base64 32  # For DB and Redis passwords
#   openssl rand -base64 64  # For secret key (longer)

# only when using internal DB
---
apiVersion: v1
kind: Secret
metadata:
  name: paperless-db-credentials
  namespace: paperless
type: Opaque
stringData:
  password: "CHANGE_ME_DB_PASSWORD"  # Use: openssl rand -base64 32
  # postgres-password: "CHANGE_ME_POSTGRES_PASSWORD"  # Only needed if using Bitnami PostgreSQL subchart

---
apiVersion: v1
kind: Secret
metadata:
  name: paperless-redis-credentials
  namespace: paperless
type: Opaque
stringData:
  redis-password: "CHANGE_ME_REDIS_PASSWORD"  # Use: openssl rand -base64 32

---
apiVersion: v1
kind: Secret
metadata:
  name: paperless-secrets
  namespace: paperless
type: Opaque
stringData:
  PAPERLESS_SECRET_KEY: "CHANGE_ME_SECRET_KEY"  # Use: openssl rand -base64 64
  PAPERLESS_ADMIN_USER: "admin"
  PAPERLESS_ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"  # Use: openssl rand -base64 32
  PAPERLESS_ADMIN_MAIL: "your-email@example.com"
  PAPERLESS_DBPASS: "CHANGE_ME_DB_PASSWORD"  # for external DB
