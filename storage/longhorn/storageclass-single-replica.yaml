# Single-replica StorageClass for workloads with application-level replication
# (CNPG clusters: immich-db, nextcloud-db, paperless-db, n8n-db, event-manager-postgres;
# also grafana). Redundancy comes from the app (PG streaming replication + barman
# backups), so one Longhorn replica avoids 3x write amplification.
# Was created by hand in Oct 2025 and only lived in-cluster; committed 2026-07-20 so a
# rebuild reproduces it. Matches the live object exactly — SC parameters are immutable,
# so any change requires delete+recreate (existing PVs keep their provisioned params).
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: longhorn-single-replica
provisioner: driver.longhorn.io
reclaimPolicy: Retain
volumeBindingMode: Immediate
allowVolumeExpansion: true
parameters:
  numberOfReplicas: "1"
  dataLocality: best-effort
  staleReplicaTimeout: "30"
  fromBackup: ""
