# Secrets Template for Longhorn S3/MinIO Backups
# Copy this file to secrets.yaml and replace CHANGE_ME_* values
# IMPORTANT: Add secrets.yaml to .gitignore to prevent committing secrets

---
# S3/MinIO Backup Credentials
# Required for: Longhorn S3 backups to MinIO or AWS S3
# Configure this if you want to enable automated backups to S3-compatible storage
apiVersion: v1
kind: Secret
metadata:
  name: minio-bucket-credentials
  namespace: longhorn-system
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: "CHANGE_ME_ACCESS_KEY_ID"
  AWS_SECRET_ACCESS_KEY: "CHANGE_ME_SECRET_ACCESS_KEY"
  AWS_ENDPOINTS: "CHANGE_ME_S3_ENDPOINT"  # e.g., "http://minio.default.svc.cluster.local:9000"
