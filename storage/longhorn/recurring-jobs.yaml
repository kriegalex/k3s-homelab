---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup-tier1
  namespace: longhorn-system
spec:
  name: weekly-backup-tier1
  cron: "30 2 * * 0"           # Sun 02:30 UTC
  task: backup
  groups: ["tier1"]
  retain: 4
  concurrency: 2
  parameters:
    full-backup-interval: "12" # incremental for 11 runs, full on 12th
  labels:
    backup-tier: tier1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-backup-tier2
  namespace: longhorn-system
spec:
  name: weekly-backup-tier2
  cron: "30 3 * * 0"           # Sun 03:30 UTC (after tier1 finishes)
  task: backup
  groups: ["tier2", "tier2-churn"]
  retain: 4
  concurrency: 4
  parameters:
    full-backup-interval: "12"
  labels:
    backup-tier: tier2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: hourly-snapshot-tier1
  namespace: longhorn-system
spec:
  name: hourly-snapshot-tier1
  cron: "15 * * * *"           # every hour at :15 — fast in-cluster recovery
  task: snapshot
  groups: ["tier1"]
  retain: 24                   # keep 24h
  concurrency: 2
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot-tier2
  namespace: longhorn-system
spec:
  name: daily-snapshot-tier2
  cron: "30 0 * * *"           # daily at 00:30 UTC
  task: snapshot
  groups: ["tier2"]
  retain: 7                    # keep 7 days
  concurrency: 4
---
# tier2-churn: tier2 volumes whose data rewrites itself constantly (nostr-strfry's
# LMDB writes ~13 GiB/day into a 36 GiB database). Seven dailies held 10-30 GiB each
# and turned every replica rebuild into hours of block-by-block hashing. One daily
# keeps the never-checksummed volume head small without paying for the history.
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: daily-snapshot-churn
  namespace: longhorn-system
spec:
  name: daily-snapshot-churn
  cron: "30 0 * * *"           # daily at 00:30 UTC
  task: snapshot
  groups: ["tier2-churn"]
  retain: 1
  concurrency: 1
---
apiVersion: longhorn.io/v1beta2
kind: RecurringJob
metadata:
  name: weekly-fstrim
  namespace: longhorn-system
spec:
  name: weekly-fstrim
  cron: "0 5 * * 0"            # Sun 05:00 UTC, after the backup jobs
  task: filesystem-trim        # reclaims deleted-file blocks from volume-head and
                               # already-removed snapshots only; valid snapshots are
                               # immutable, so space frozen in retained snapshots frees
                               # up progressively as they age out of retention
  groups: ["tier1", "tier2", "tier2-churn"]
  retain: 1                    # not used by this task, but the CRD requires >= 1
  concurrency: 2
