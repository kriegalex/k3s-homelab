---
# Dedicated namespace + ServiceAccount for the NFS stale-handle auto-healer.
# The CronJob lives here; its RBAC (rbac.yaml) is granted into the three app
# namespaces it heals (immich, nextcloud, paperless).
apiVersion: v1
kind: Namespace
metadata:
  name: nfs-healer
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: nfs-healer
  namespace: nfs-healer
