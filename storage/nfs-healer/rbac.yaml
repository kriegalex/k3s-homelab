---
# Least-privilege RBAC for the auto-healer: read events, and read/delete pods.
# Events are namespaced, so a RoleBinding per app namespace is enough — no
# ClusterRoleBinding — which caps the blast radius to exactly these three
# namespaces (the healer can never touch pods elsewhere in the cluster).
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: nfs-healer
rules:
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfs-healer
  namespace: immich
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nfs-healer
subjects:
  - kind: ServiceAccount
    name: nfs-healer
    namespace: nfs-healer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfs-healer
  namespace: nextcloud
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nfs-healer
subjects:
  - kind: ServiceAccount
    name: nfs-healer
    namespace: nfs-healer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: nfs-healer
  namespace: paperless
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: nfs-healer
subjects:
  - kind: ServiceAccount
    name: nfs-healer
    namespace: nfs-healer
