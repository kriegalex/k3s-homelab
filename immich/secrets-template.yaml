# Immich Secrets Template
#
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Generate a secure password and update the placeholder below
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore (DO NOT COMMIT)
#
# Generate secure password:
#   openssl rand -base64 32

---
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-credentials
  namespace: immich
type: Opaque
stringData:
  DB_USERNAME: "immich"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"  # Same as above (for envFrom)
