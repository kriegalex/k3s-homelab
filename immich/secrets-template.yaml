# Immich Secrets Template
#
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Generate secure passwords and update all CHANGE_ME_* placeholders
# 3. Apply: kubectl apply -f secrets.yaml
# 4. secrets.yaml is in .gitignore - DO NOT COMMIT
#
# Generate secure password:
#   openssl rand -base64 32

---
# CNPG cluster bootstrap secret (used by cnpg-cluster.yaml)
apiVersion: v1
kind: Secret
metadata:
  name: immich-pg-user
  namespace: immich
type: Opaque
stringData:
  username: "immich"
  password: "CHANGE_ME_DB_PASSWORD"
---
# App-level secret for envFrom in Helm chart
apiVersion: v1
kind: Secret
metadata:
  name: immich-db-credentials
  namespace: immich
type: Opaque
stringData:
  DB_USERNAME: "immich"
  DB_PASSWORD: "CHANGE_ME_DB_PASSWORD"  # Must match immich-pg-user password above
