apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
spec:
  instances: 3

  # Disable botocore flexible checksums so backups keep working if this image is
  # ever bumped to botocore >=1.36 (the QNAP swift3 S3 gateway rejects the new
  # x-amz-checksum-crc32 with InvalidDigest). See database/cloudnative-pg/README.md.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required

  # Tensorchord image with VectorChord; keep the vchord version aligned with the
  # one immich's own docker-compose pins for the deployed immich release
  # (v2.7.5 pins vectorchord 0.4.3). After bumping: ALTER EXTENSION vchord UPDATE;
  # REINDEX INDEX face_index; REINDEX INDEX clip_index;
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.9-0.4.3
  
  # https://github.com/tensorchord/cloudnative-pgvecto.rs
  postgresql:
    shared_preload_libraries:
      - "vchord.so"

  # Database configuration
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-pg-user
      postInitSQL:
        - ALTER USER immich WITH SUPERUSER;
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;

  # Storage configuration
  storage:
    size: 30Gi
    storageClass: longhorn-single-replica

  resources:
    requests:
      memory: 512Mi
      cpu: 150m
    limits:
      memory: 1Gi
      cpu: 500m

  # WAL archiving + base backups via plugin-barman-cloud (in-tree barmanObjectStore
  # removed in CNPG 1.31). Store config: immich-objectstore.yaml.
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: immich-backup-store

  monitoring:
    enablePodMonitor: true
