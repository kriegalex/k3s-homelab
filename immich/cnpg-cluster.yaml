apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: immich-db
  namespace: immich
spec:
  instances: 3

  # Disable botocore flexible checksums so backups keep working if this image is
  # ever bumped to botocore >=1.36 (the QNAP swift3 S3 gateway rejects the new
  # x-amz-checksum-crc32 with InvalidDigest). See database/cloudnative-pg/README.md.
  env:
    - name: AWS_REQUEST_CHECKSUM_CALCULATION
      value: when_required
    - name: AWS_RESPONSE_CHECKSUM_VALIDATION
      value: when_required

  # Using the tensorchord image with pgvecto.rs
  imageName: ghcr.io/tensorchord/cloudnative-vectorchord:16.8-0.3.0
  
  # https://github.com/tensorchord/cloudnative-pgvecto.rs
  postgresql:
    shared_preload_libraries:
      - "vchord.so"

  # Database configuration
  bootstrap:
    initdb:
      database: immich
      owner: immich
      secret:
        name: immich-pg-user
      postInitSQL:
        - ALTER USER immich WITH SUPERUSER;
      postInitApplicationSQL:
        - CREATE EXTENSION IF NOT EXISTS vchord CASCADE;

  # Storage configuration
  storage:
    size: 30Gi
    storageClass: longhorn-single-replica

  resources:
    requests:
      memory: 512Mi
      cpu: 150m
    limits:
      memory: 1Gi
      cpu: 500m

  backup:
    barmanObjectStore:
      destinationPath: "s3://immich-backups/"
      endpointURL: "http://10.0.0.7:8010"
      s3Credentials:
        accessKeyId:
          name: immich-s3-backup-credentials
          key: ACCESS_KEY_ID
        secretAccessKey:
          name: immich-s3-backup-credentials
          key: ACCESS_SECRET_KEY
      wal:
        compression: bzip2
      data:
        compression: bzip2
    retentionPolicy: "30d"

  monitoring:
    enablePodMonitor: true
