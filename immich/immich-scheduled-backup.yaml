---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: immich-scheduled-backup
  namespace: immich
spec:
  schedule: "0 4 1 ? * SUN"
  backupOwnerReference: self
  cluster:
    name: immich-db
  immediate: true
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
