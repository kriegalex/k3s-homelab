## This chart relies on the common library chart from bjw-s
## You can find it at https://github.com/bjw-s/helm-charts/tree/main/charts/library/common
## Refer there for more detail about the supported values

# These entries are shared between all the Immich components

controllers:
  main:
    containers:
      main:
        image:
          tag: v2.5.3
        env:
          REDIS_HOSTNAME: '{{ printf "%s-valkey" .Release.Name }}'
          IMMICH_MACHINE_LEARNING_URL: '{{ printf "http://%s-machine-learning:3003" .Release.Name }}'
          DB_HOSTNAME: "immich-db-rw"
          DB_DATABASE_NAME: "immich"
        envFrom:
          - secretRef:
              name: immich-db-credentials # DB_USERNAME, DB_PASSWORD
          

immich:
  metrics:
    # Enabling this will create the service monitors needed to monitor immich with the prometheus operator
    enabled: false
  persistence:
    # Main data store for all photos shared between different components.
    library:
      # Automatically creating the library volume is not supported by this chart
      # You have to specify an existing PVC to use
      existingClaim: "nfs-immich"
  # configuration is immich-config.json converted to yaml
  # ref: https://immich.app/docs/install/config-file/
  configuration: {}
    # trash:
    #   enabled: false
    #   days: 30
    # storageTemplate:
    #   enabled: true
    #   template: "{{y}}/{{y}}-{{MM}}-{{dd}}/{{filename}}"

persistence:
  external:
    enabled: true
    existingClaim: "nfs-nextcloud-ro"

# Dependencies

valkey:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
  persistence:
    data:
      enabled: true
      size: 1Gi
      # Optional: Set this to persistentVolumeClaim to keep job queues persistent
      type: persistentVolumeClaim
      accessMode: ReadWriteOnce
      storageClass: longhorn-single-replica
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/instance
              operator: In
              values:
              - immich
          topologyKey: kubernetes.io/hostname

# Immich components

server:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 100m
              memory: 1Gi
              gpu.intel.com/i915: "1"
            limits:
              cpu: 2000m
              memory: 2Gi
              gpu.intel.com/i915: "1"
  ingress:
    main:
      enabled: True
      className: traefik
      annotations:
        cert-manager.io/cluster-issuer: letsencrypt-prod
        # Traefik streams request bodies by default with no cap — file uploads
        # are unconstrained without an explicit Buffering middleware.
      hosts:
        - host: immich.lourenco.ch
          paths:
            - path: "/"
      tls:
        - secretName: immich-tls
          hosts:
            - immich.lourenco.ch

machine-learning:
  enabled: true
  controllers:
    main:
      containers:
        main:
          resources:
            requests:
              cpu: 100m
              memory: 768Mi
            limits:
              cpu: 4000m
              memory: 4Gi
  persistence:
    cache:
      enabled: true
      size: 10Gi
      # Optional: Set this to persistentVolumeClaim to avoid downloading the ML models every start.
      type: persistentVolumeClaim
      accessMode: ReadWriteMany
      storageClass: longhorn
  # Add affinity rules for ml to co-locate with Immich
  affinity:
    podAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 80
        podAffinityTerm:
          labelSelector:
            matchExpressions:
            - key: app.kubernetes.io/instance
              operator: In
              values:
              - immich
          topologyKey: kubernetes.io/hostname

# Add affinity rules for Redis to co-locate with Nextcloud
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-worker4
  podAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 80
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/instance
            operator: In
            values:
            - immich
        topologyKey: kubernetes.io/hostname
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
    - weight: 80
      podAffinityTerm:
        labelSelector:
          matchExpressions:
          - key: app.kubernetes.io/name
            operator: In
            values:
            - plex-media-server
        namespaces:
          - plex
        topologyKey: kubernetes.io/hostname
