# Bluesky PDS Secrets Template
#
# IMPORTANT: This is a template file. DO NOT commit actual secrets to git.
#
# Usage:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Generate the required secrets (see commands below)
# 3. Replace the placeholder values
# 4. Add secrets.yaml to .gitignore (already done in root .gitignore)
# 5. Apply: kubectl apply -f secrets.yaml

---
apiVersion: v1
kind: Secret
metadata:
  name: bluesky-pds-secrets
  namespace: bluesky-pds
type: Opaque
stringData:
  # JWT Secret (for API authentication)
  # Generate with: openssl rand --hex 16
  jwtSecret: "REPLACE_WITH_JWT_SECRET"

  # PLC Rotation Key (for identity/DID management)
  # Generate with:
  # openssl ecparam --name secp256k1 --genkey --noout --outform DER | \
  #   tail --bytes=+8 | head --bytes=32 | xxd --plain --cols 32
  plcRotationKey: "REPLACE_WITH_PLC_ROTATION_KEY"

  # Admin Password (for PDS admin interface)
  # Generate with: openssl rand --hex 16
  adminPassword: "REPLACE_WITH_ADMIN_PASSWORD"

  # Optional: Email SMTP URL (for notifications, password resets)
  # Format for SMTPS (SSL): smtps://username:password@smtp.example.com:465/
  # Format for SMTP+STARTTLS: smtp://username:password@smtp.example.com:587/
  # Leave empty to disable email
  emailSmtpUrl: ""

# Example: Generate all secrets at once
#
# Run these commands and save the output securely:
#
# echo "JWT Secret:"
# openssl rand --hex 16
#
# echo "PLC Rotation Key:"
# openssl ecparam --name secp256k1 --genkey --noout --outform DER | \
#   tail --bytes=+8 | head --bytes=32 | xxd --plain --cols 32
#
# echo "Admin Password:"
# openssl rand --hex 16
