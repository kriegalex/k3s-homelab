---
# Gift-wrap retention for strfry.
#
# WHY: kind 1059 (NIP-59 gift wrap) is a *delivery buffer*, not an archive — it
# exists so an offline recipient can collect a DM later. But NIP-01 puts 1059 in
# the 1000-9999 "regular" range, so relays are expected to store it forever, and
# NIP-40 expiry is opt-in that almost nobody sets (measured 2026-07-25: 2,644 of
# 4.75 M events, 0.06%). Result: DMs accumulate without bound. A May-June 2026
# flood put ~2 M gift wraps on this relay (48% of all events) and pushed the PVC
# to 73%. See claude-docs/nostr-giftwrap-purge.md.
#
# maxEventSize=65536 (already set in values.yaml) caps each event but does NOT
# bound the count — strfry still absorbed 1.23 M gift wraps in June alone, more
# than nostr-rs-relay did. Retention is the part that actually bounds growth.
#
# OWN-DM EXEMPTION (added 2026-07-26): a plain `delete --filter {"kinds":[1059]}`
# also deletes the operator's OWN incoming DMs after 30 days. strfry filters are
# purely positive — there is no "except mine" — so this job exports the gift
# wraps p-tagged to the operator, runs the delete, then re-imports them. The
# export lands on the PVC, so a pod restart mid-sweep cannot lose them: the next
# run restores the keep-file before doing anything else.
#
# The operator pubkey is PII and never committed (same rule as the NIP-11 `self`
# npub) — it comes from the `strfry-retention-keep` Secret. If that Secret is
# missing the pod fails to start, which fails CLOSED: no delete runs unprotected.
#
# Everything that is NOT a gift wrap (notes, profiles, contacts, reactions,
# long-form) is kept forever — that is the content with archival value.
#
# NOTE: deletes free LMDB pages for reuse but do NOT shrink data.mdb. The file
# stays at its high-water mark and the relay grows into the free space. To
# actually return disk you must `strfry compact <out>` and swap, which needs
# room for the new file alongside the old — deliberately not done here.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: strfry-retention
  namespace: nostr
---
# Least privilege: namespaced Role (not ClusterRole) so this can only ever exec
# into pods in `nostr`. It needs pods/exec because strfry's dbutils operate on
# the LMDB directly and must run inside the relay container — the volume is RWO
# and LMDB tolerates only a single writer, so a second pod mounting it is not an
# option.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: strfry-retention
  namespace: nostr
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: strfry-retention
  namespace: nostr
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: strfry-retention
subjects:
  - kind: ServiceAccount
    name: strfry-retention
    namespace: nostr
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: strfry-giftwrap-retention
  namespace: nostr
spec:
  # Daily, off-peak. Steady state deletes only ~1 day of gift wraps, which is
  # fast; the expensive part was the one-off backfill done by hand on 2026-07-25.
  schedule: "15 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      # Generous: the first large sweep took minutes and holds the LMDB write
      # lock throughout. Steady-state runs finish in seconds.
      activeDeadlineSeconds: 3600
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: strfry-retention
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
          containers:
            - name: retention
              # alpine/k8s = alpine + kubectl. Same image/pinning convention as
              # storage/nfs-healer — bump the tag on cluster upgrade.
              image: alpine/k8s:1.31.6
              env:
                # Operator pubkey (64-char hex, NOT npub) whose incoming DMs are
                # exempt from retention. PII — lives only in this Secret.
                # See secrets-template.yaml for the create command.
                - name: MYPK
                  valueFrom:
                    secretKeyRef:
                      name: strfry-retention-keep
                      key: pubkey
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -u
                  # 30 days. strfry --age takes PLAIN SECONDS; "30d" is rejected
                  # with "contains non-numeric characters".
                  AGE=2592000
                  FILTER='{"kinds":[1059]}'
                  # Keep-file lives on the relay PVC, not in this pod, so it
                  # survives a crash between delete and re-import.
                  KEEP=/app/strfry-db/.retention-keep.jsonl
                  # Prefix for every remote command; strfry must run from /app.
                  CD="cd /app"
                  SF="./strfry --config=/etc/strfry.conf"

                  # Fail closed. An empty/garbage pubkey would silently export
                  # nothing and let the delete eat the operator's own DMs.
                  if ! echo "$MYPK" | grep -qE '^[0-9a-f]{64}$'; then
                    echo "MYPK is not 64-char lowercase hex (npub is NOT accepted); refusing to run"
                    exit 1
                  fi
                  MINE="{\"kinds\":[1059],\"#p\":[\"$MYPK\"]}"

                  POD=$(kubectl -n nostr get pods \
                        -l app.kubernetes.io/name=nostr-strfry \
                        --field-selector=status.phase=Running \
                        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
                  if [ -z "$POD" ]; then
                    echo "no running strfry pod; nothing to do"
                    exit 0
                  fi

                  # Guard: a kubectl exec that detaches does NOT kill the remote
                  # process (learned the hard way 2026-07-25 — the client
                  # returned while `delete` kept running for minutes). If a
                  # sweep is still in flight, skip rather than stack a second
                  # writer against the LMDB lock.
                  # stderr is silenced because the HEALTHY path is a non-zero
                  # exit: `grep -q` returns 1 when no delete is running, and
                  # kubectl then prints "command terminated with exit code 1",
                  # which reads like a failure in the Job log but is not one.
                  if kubectl -n nostr exec "$POD" -- sh -c \
                       'ps ax 2>/dev/null | grep -v grep | grep -q "strfry.*delete"' 2>/dev/null; then
                    echo "a strfry delete is already running in $POD; skipping this sweep"
                    exit 0
                  fi

                  # STEP 0 — restore a keep-file left behind by a previous run
                  # that died after the delete. Re-importing events the relay
                  # already has is a no-op, so this is safe every time.
                  kubectl -n nostr exec "$POD" -- sh -c \
                    "$CD && if [ -s $KEEP ]; then \
                       echo \"restoring \$(wc -l < $KEEP) kept gift wrap(s)\"; \
                       $SF import < $KEEP; \
                     fi" || { echo "restore step failed; refusing to delete"; exit 1; }

                  # STEP 1 — export the operator's own gift wraps. Write to a
                  # .new file and only promote it once the export succeeded, so
                  # a failed scan can never blank out a good keep-file.
                  kubectl -n nostr exec "$POD" -- sh -c \
                    "$CD && $SF scan '$MINE' \
                       > $KEEP.new 2>/dev/null && mv $KEEP.new $KEEP" \
                    || { echo "export of own DMs failed; refusing to delete"; exit 1; }
                  KEPT=$(kubectl -n nostr exec "$POD" -- sh -c "wc -l < $KEEP" 2>/dev/null | tr -d ' \r')
                  echo "exempting ${KEPT:-0} of my own gift wrap(s) from this sweep"

                  # STEP 2 — the actual retention delete.
                  echo "pruning gift wraps older than ${AGE}s from $POD"
                  kubectl -n nostr exec "$POD" -- sh -c \
                    "$CD && $SF delete --age=$AGE --filter '$FILTER'" \
                    || { echo "delete failed; keep-file retained for next run"; exit 1; }

                  # STEP 3 — put the operator's own DMs back.
                  kubectl -n nostr exec "$POD" -- sh -c \
                    "$CD && if [ -s $KEEP ]; then \
                       $SF import < $KEEP; \
                     fi" || { echo "re-import FAILED — keep-file is still at $KEEP on the PVC"; exit 1; }

                  echo "retention sweep complete"
              resources:
                requests: { cpu: "20m", memory: "48Mi" }
                limits: { cpu: "200m", memory: "128Mi" }
