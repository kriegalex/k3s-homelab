# Procedure for the `nostr-strfry-config` Secret (referenced by
# `config.existingSecret` in values.yaml since chart 1.3.0). The Secret holds
# the COMPLETE rendered strfry.conf; committed values.yaml stays the source
# for everything except the NIP-11 `self` npub (PII, never committed).
#
# To (re)generate the Secret after editing values.yaml:
#
#   # 1. Render strfry.conf from committed values + the real npub
#   #    (temporarily overriding existingSecret so the chart renders it):
#   helm template nostr-strfry k8s-charts/nostr-strfry \
#     --version 1.3.0 -n nostr -f values.yaml \
#     --set config.existingSecret="" \
#     --set config.relay.info.self='CHANGE_ME_NPUB' \
#     -s templates/configmap.yaml > /tmp/strfry-cm.yaml
#   yq -r 'select(.metadata.name == "nostr-strfry-config") | .data["strfry.conf"]' \
#     /tmp/strfry-cm.yaml > /tmp/strfry.conf
#
#   # 2. Replace the Secret and restart the relay:
#   kubectl -n nostr create secret generic nostr-strfry-config \
#     --from-file=strfry.conf=/tmp/strfry.conf \
#     --dry-run=client -o yaml | kubectl -n nostr apply -f -
#   kubectl -n nostr rollout restart deployment nostr-strfry
#   rm /tmp/strfry-cm.yaml /tmp/strfry.conf
