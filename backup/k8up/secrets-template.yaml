# k8up Backup Secrets Template
#
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Update all CHANGE_ME placeholders
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore (DO NOT COMMIT)
#
# These secrets are required for k8up to backup to S3-compatible storage.

---
# S3 Credentials Secret
# Used to authenticate to your S3-compatible storage (AWS S3, MinIO, Wasabi, etc.)
apiVersion: v1
kind: Secret
metadata:
  name: minio-credentials
  namespace: default  # Change to your backup namespace
type: Opaque
stringData:
  username: "CHANGE_ME_S3_ACCESS_KEY"
  password: "CHANGE_ME_S3_SECRET_KEY"

---
# Restic Repository Password Secret
# This password encrypts your backup data
# IMPORTANT: Store this securely! Without it, you cannot restore backups.
apiVersion: v1
kind: Secret
metadata:
  name: backup-repo
  namespace: default  # Change to your backup namespace
type: Opaque
stringData:
  password: "CHANGE_ME_RESTIC_PASSWORD"  # Use: openssl rand -base64 32

---
