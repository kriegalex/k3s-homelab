# k8up Manual Backup Example
#
# This manifest triggers an immediate backup of resources in a namespace.
# k8up uses Restic to backup to S3-compatible storage.
#
# Documentation: https://k8up.io/k8up/2.x/how-tos/backup.html

---
# Manual PVC Backup
# Backs up a PersistentVolumeClaim to S3
apiVersion: k8up.io/v1
kind: Backup
metadata:
  name: manual-pvc-backup
  namespace: default
spec:
  # Backend configuration
  backend:
    # Reference to Restic password secret
    repoPasswordSecretRef:
      name: backup-repo
      key: password

    # S3 configuration
    s3:
      endpoint: "http://minio.minio.svc.cluster.local:9000"  # MinIO endpoint
      # endpoint: "https://s3.amazonaws.com"  # AWS S3
      # endpoint: "https://s3.us-west-1.wasabisys.com"  # Wasabi

      bucket: "my-pvc-backups"  # S3 bucket name

      # Reference to S3 credentials secret
      accessKeyIDSecretRef:
        name: minio-credentials
        key: username
      secretAccessKeySecretRef:
        name: minio-credentials
        key: password

  # Pod security context
  podSecurityContext:
    runAsUser: 1000  # User ID to run backup pod as
    fsGroup: 1000
    fsGroupChangePolicy: OnRootMismatch

  # Job history limits
  failedJobsHistoryLimit: 2
  successfulJobsHistoryLimit: 2

  # Optional: Tags for this backup
  tags:
    - manual
    - pvc-backup

---
# PostgreSQL Database Backup with Annotation
# Use pod annotations to backup databases
#
# First, annotate your PostgreSQL pod:
# kubectl annotate pod postgres-0 \
#   k8up.io/backupcommand="sh -c 'PGDATABASE=\$POSTGRES_DB PGUSER=\$POSTGRES_USER PGPASSWORD=\$POSTGRES_PASSWORD pg_dump --clean'" \
#   k8up.io/file-extension=".sql"
#
# Then trigger backup:
apiVersion: k8up.io/v1
kind: Backup
metadata:
  name: manual-postgres-backup
  namespace: default
spec:
  backend:
    repoPasswordSecretRef:
      name: backup-repo
      key: password
    s3:
      endpoint: "http://minio.minio.svc.cluster.local:9000"
      bucket: "postgres-backups"
      accessKeyIDSecretRef:
        name: minio-credentials
        key: username
      secretAccessKeySecretRef:
        name: minio-credentials
        key: password

  podSecurityContext:
    runAsUser: 999  # PostgreSQL user ID

  failedJobsHistoryLimit: 2
  successfulJobsHistoryLimit: 2

---
# CloudNativePG Backup Example
# k8up can backup CloudNativePG clusters
#
# Annotate the CloudNativePG primary pod:
# kubectl annotate pod cluster-1 -n database \
#   k8up.io/backupcommand="sh -c 'pg_dumpall --clean --if-exists --username=postgres'" \
#   k8up.io/file-extension=".sql"
#
apiVersion: k8up.io/v1
kind: Backup
metadata:
  name: manual-cnpg-backup
  namespace: database
spec:
  backend:
    repoPasswordSecretRef:
      name: backup-repo
      key: password
    s3:
      endpoint: "http://minio.minio.svc.cluster.local:9000"
      bucket: "cnpg-backups"
      accessKeyIDSecretRef:
        name: minio-credentials
        key: username
      secretAccessKeySecretRef:
        name: minio-credentials
        key: password

  podSecurityContext:
    runAsUser: 26  # CNPG postgres user

  failedJobsHistoryLimit: 2
  successfulJobsHistoryLimit: 2
