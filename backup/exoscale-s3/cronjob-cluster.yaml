---
# Off-site copy of the CLUSTER-side backups — the seven CNPG buckets and the
# etcd snapshots — to Exoscale SOS, alongside the user-data job in cronjob.yaml.
#
# WHY THIS EXISTS (review-2026-09-19, finding B-2, ranked #1):
# Every cluster-side backup converges on one QNAP: all seven CNPG ObjectStores
# (s3://<app>-backups at http://10.0.0.7:8010), the Longhorn backup target, and
# the etcd snapshots. That box takes NO volume snapshots, has NO replication
# (HBS 3 unconfigured), and one of its four disks has already lost data
# (519 uncorrectable sectors). A second on-site copy was declined on disk cost.
#
# The consequence that makes this urgent is not "we lose the databases" — it is
# that the EXISTING off-site job (cronjob.yaml) copies payload FILES ONLY:
# immich photos, nextcloud files, paperless scans. Every Postgres database is
# QNAP-only. So losing that array leaves an off-site copy that is metadata-blind:
#   immich     -> photo blobs survive, albums/faces/places/timeline are gone
#   nextcloud  -> file blobs survive, shares/tags/the file tree are gone
#   paperless  -> scans survive, OCR text/tags/correspondents are gone
#   n8n, event-manager, dealwatch, vigie -> lost outright
# The CNPG buckets are ~2.4 GB in total (~28 000 objects, mostly WAL), so closing that hole
# costs a few cents a month. This is the cheapest high-value item in the review.
#
# SOURCE IS S3, NOT NFS. Reading the QNAP's S3 endpoint avoids mounting shares
# from a box that is about to be rebuilt, and keeps working if the buckets move.
# Requires a [qnap-s3] remote in the rclone.conf Secret — see README "QNAP S3
# remote" for the section shape and the Secret regeneration command.
#
# ETCD COMES FROM THE SOURCE, NOT THE QNAP COPY. The snapshots are read via
# hostPath from k3s-server1 itself, which is why this job is pinned to the
# control-plane node. That deliberately bypasses the QNAP: an etcd snapshot
# copied from a failing array is worth less than one taken from the origin.
# NOTE: a snapshot contains every unencrypted Secret in the cluster (k3s docs),
# which is exactly why it must go through `crypt` and never to a plain bucket.
#
# RETENTION IS BOUNDED, same scheme as cronjob.yaml: `rclone sync --backup-dir`
# mirrors each source, and whatever the sync would delete or overwrite is MOVED
# to exoscale-crypt:_archive-cluster/<run date>/... and purged after KEEP_DAYS.
# The sources prune themselves (barman retentionPolicy 30d, k3s
# etcd-snapshot-retention 14), so the mirror is bounded by them and the archive
# by KEEP_DAYS — with `copy`, etcd alone grew ~117 MiB/day forever. A corrupted
# or truncated source still cannot destroy the off-site copy inside that window.
# Each source must also show a RECENT object or the job fails (KubeJobFailed):
# syncing from a bucket that stopped receiving WAL would quietly age the
# off-site copy out.
# NOTE the Exoscale key still has full control (finding B-4). Bucket versioning
# closes that, but only together with a lifecycle rule expiring noncurrent
# versions — versioning alone keeps every archived-then-purged object forever.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: exoscale-s3-cluster-backup
  namespace: backup
spec:
  schedule: "30 3 * * *"           # daily 03:30 UTC — after the 02:00 data job,
                                   # and after the 03:00 node-local etcd snapshot (01:00/02:00 UTC)
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 3600
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          # Pinned because the etcd snapshots live on this node's filesystem.
          # If server1 is down the cluster has larger problems and the snapshot
          # would be stale anyway, so failing here is the honest outcome.
          nodeSelector:
            node-role.kubernetes.io/control-plane: "true"
          # k3s-ansible taints server1 with the legacy `master` key; the
          # `control-plane` key is tolerated too so a re-taint does not strand
          # the job in Pending.
          tolerations:
            - key: node-role.kubernetes.io/master
              operator: Exists
              effect: NoSchedule
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          securityContext:
            runAsUser: 0           # etcd snapshot dir is root-owned 0700
          containers:
            - name: rclone
              image: rclone/rclone:1.74.2
              env:
                - name: RCLONE_CONFIG
                  value: /config/rclone.conf
                - name: HC_URL        # heartbeat ping URL; optional
                  valueFrom:
                    secretKeyRef: { name: backup-heartbeats, key: HC_CLUSTER_URL, optional: true }
                - name: KEEP_DAYS     # how long deleted/overwritten files stay recoverable
                  value: "30"
              command: ["/bin/sh", "-c"]
              args:
                - |
                  set -eu
                  # Dead-man's switch (monitoring/deadman): ping /start now and the
                  # exit status on the way out (0 = success, anything else = fail).
                  # Best-effort by design: without the optional Secret, or with the
                  # watcher unreachable, the backup runs exactly as before.
                  hc() { [ -z "${HC_URL:-}" ] || wget -q -T 10 -O /dev/null "${HC_URL}$1" || true; }
                  trap 'hc "/$?"' EXIT
                  hc /start
                  # Far smaller than the user-data job (~4 GB vs ~400 GB), so the
                  # aggressive multipart tuning there is unnecessary here. Memory
                  # stays low: transfers * s3-upload-concurrency * s3-chunk-size.
                  COMMON="--transfers=4 --checkers=8 --fast-list \
                          --s3-chunk-size=16Mi --s3-upload-concurrency=2 \
                          --retries=3 --low-level-retries=10 --use-mmap \
                          --log-level=INFO --stats=1m --stats-one-line"

                  ARCHIVE=_archive-cluster
                  TODAY=$(date -u +%F)

                  # --- CNPG base backups + WAL, seven clusters ---------------
                  # Bucket names come from each ObjectStore's destinationPath
                  # (s3://<app>-backups/). Grouped under cnpg/ on the far side;
                  # crypt encrypts the path components either way.
                  for app in dealwatch immich event-manager n8n nextcloud paperless vigie; do
                    # WAL is archived at least every few minutes, so a bucket
                    # with nothing newer than 2 days is broken, not quiet.
                    if [ -z "$(rclone lsf -R --files-only --max-age 2d "qnap-s3:${app}-backups" | head -n 1)" ]; then
                      echo "FATAL: qnap-s3:${app}-backups has no object newer than 2d - refusing to sync" >&2
                      exit 1
                    fi
                    echo "===== sync cnpg/$app (qnap-s3:${app}-backups) ====="
                    # shellcheck disable=SC2086
                    rclone sync "qnap-s3:${app}-backups" "exoscale-crypt:cnpg/${app}" \
                      --backup-dir "exoscale-crypt:$ARCHIVE/$TODAY/cnpg/${app}" $COMMON
                  done

                  # --- etcd snapshots, read from the control-plane node -------
                  if [ -z "$(rclone lsf --files-only --max-age 2d /etcd-snapshots | head -n 1)" ]; then
                    echo "FATAL: no etcd snapshot newer than 2d in /etcd-snapshots - refusing to sync" >&2
                    exit 1
                  fi
                  echo "===== sync etcd (/etcd-snapshots) ====="
                  # shellcheck disable=SC2086
                  rclone sync /etcd-snapshots "exoscale-crypt:etcd" \
                    --backup-dir "exoscale-crypt:$ARCHIVE/$TODAY/etcd" $COMMON

                  # --- prune archive days older than KEEP_DAYS -----------------
                  # By dated directory name, not object age: a server-side move
                  # keeps the original mtime (see cronjob.yaml header).
                  CUTOFF=$(date -u -d "@$(( $(date -u +%s) - KEEP_DAYS * 86400 ))" +%Y%m%d)
                  for day in $(rclone lsf --dirs-only "exoscale-crypt:$ARCHIVE" 2>/dev/null | tr -d /); do
                    case "$day" in
                      [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
                      *) echo "skip unexpected archive entry: $day"; continue ;;
                    esac
                    if [ "$(echo "$day" | tr -d -)" -lt "$CUTOFF" ]; then
                      echo "===== purge $ARCHIVE/$day (older than ${KEEP_DAYS}d) ====="
                      rclone purge "exoscale-crypt:$ARCHIVE/$day"
                    fi
                  done

                  # --- Longhorn volume backups: DELIBERATELY NOT ENABLED ------
                  # ~253 G (backup-strategy.md) => roughly €5/month at Exoscale's
                  # €0.0198/GB, which more than doubles the current bill, versus
                  # ~4 G for everything above. It is also the most reconstructible
                  # tier: app PVCs whose real content is the databases (copied
                  # above) or the NFS data (copied by cronjob.yaml). Enable only
                  # as a deliberate, priced decision (same sync + --backup-dir form
                  # as above, so it stays bounded by Longhorn's retain=4).
                  echo "===== cluster backup complete ====="
              volumeMounts:
                - { name: rclone-config, mountPath: /config, readOnly: true }
                - { name: etcd-snapshots, mountPath: /etcd-snapshots, readOnly: true }
              resources:
                requests: { cpu: "100m", memory: "256Mi" }
                # crypt is AES-bound; 1Gi is ample for ~4 GB of input plus
                # multipart buffers and listing.
                limits: { cpu: "1", memory: "1Gi" }
          volumes:
            # Same Secret as the user-data job. It must now also carry the
            # [qnap-s3] section — see README "QNAP S3 remote".
            - name: rclone-config
              secret:
                secretName: exoscale-rclone-config
            # k3s writes snapshots here on the server node (see docs.k3s.io
            # /cli/etcd-snapshot). Read-only: this job must never be able to
            # delete a snapshot.
            - name: etcd-snapshots
              hostPath:
                path: /var/lib/rancher/k3s/server/db/snapshots
                type: Directory
