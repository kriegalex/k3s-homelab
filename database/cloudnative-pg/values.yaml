# CloudNativePG Operator Custom Values
#
# This file contains minimal configuration for the CloudNativePG operator.
# The operator has good defaults and requires minimal customization.
#
# Chart Repository: https://cloudnative-pg.github.io/charts
# Chart Version: 0.23.0
# Documentation: https://cloudnative-pg.io/documentation/

# The operator itself requires minimal configuration
# Most configuration happens in Cluster CRDs (see example-cluster.yaml)

# Optional: Configure operator-level settings
config:
  # Skip backup annotation requirement (default: false)
  # When true, only resources with k8up.io/backup annotation will be backed up
  BACKUP_SKIP_WITHOUT_ANNOTATION: "true"
