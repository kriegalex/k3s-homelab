name: Security Scan
on:
  push:
    branches:
      - main
      - develop

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Install TruffleHog
        run: |
          set -e
          TEMP_DIR=$(mktemp -d)
          cd "$TEMP_DIR"
          wget --no-verbose https://github.com/trufflesecurity/trufflehog/releases/download/v3.93.1/trufflehog_3.93.1_linux_amd64.tar.gz
          echo "2edf991c20fd8e6d2ec5f255b928289156bc1f0640618829c580c6e87e28ff57  trufflehog_3.93.1_linux_amd64.tar.gz" | sha256sum -c -
          tar -xzf trufflehog_3.93.1_linux_amd64.tar.gz
          chmod +x trufflehog
          mkdir -p $HOME/.local/bin
          mv trufflehog $HOME/.local/bin/
          cd -
          rm -rf "$TEMP_DIR"
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Scan for secrets
        run: |
          trufflehog git file://. --fail --exclude-paths .trufflehog-exclude.txt
