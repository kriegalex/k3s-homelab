# Traefik v3 — k3s homelab, parallel-run config
deployment:
  replicas: 2

# Spread the 2 replicas onto different nodes so the MetalLB L2 LB IP is
# not pinned to a single node once externalTrafficPolicy is Local.
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule

ingressClass:
  enabled: true
  isDefaultClass: false             # do NOT steal Ingresses without explicit class
  name: traefik

providers:
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: true                 # writes LB IP back to Ingress status
  kubernetesCRD:
    enabled: true
    allowCrossNamespace: false
    allowExternalNameServices: true

ports:
  web:
    port: 8000
    exposedPort: 80
    # Do NOT add a global http→https redirect here. Tier-1 services are HTTP-only.
  websecure:
    port: 8443
    exposedPort: 443
    http:
      tls:
        enabled: true

service:
  enabled: true
  # No metallb annotation yet — auto-assign during parallel run.
  # Chart v40+: k8s-native ServiceSpec syntax, `type` lives under `spec`.
  spec:
    type: LoadBalancer
    # Preserve real client IP: with MetalLB L2, ETP=Local makes the
    # elected node deliver to a local Traefik pod with no SNAT. Requires
    # ≥2 replicas spread across nodes (see topologySpreadConstraints).
    externalTrafficPolicy: Local

# Traefik's API endpoint (api@internal) is enabled by default in the chart.
# Disable the chart's built-in dashboard IngressRoute — we create our own.
ingressRoute:
  dashboard:
    enabled: false

# Chart v41+: `logs.general` → `log`, `logs.access` → `accessLog`.
log:
  level: INFO
accessLog:
  enabled: true

metrics:
  prometheus:
    addRoutersLabels: true
    service:
      enabled: true
    serviceMonitor:
      enabled: true
      additionalLabels:
        release: prometheus
