# cert-manager DNS-01 webhook for Infomaniak — upstream's rendered manifest for v0.5.0.
#
# Source: https://github.com/Infomaniak/cert-manager-webhook-infomaniak/releases/download/v0.5.0/rendered-manifest.yaml
# unchanged (the image is pinned to `0.5.0` upstream since v0.4.2). Older releases rendered
# `:latest`; that is how this Deployment, applied by hand in 2025 and never committed, was
# silently upgraded when the 2026-10-04 node reboots rescheduled its pod.
#
# Since v0.4.0 the webhook uses Infomaniak's API v2 (zones + DNS records). The API token in
# Secret `cert-manager/infomaniak-api-credentials` (key `api-token`) must carry the scopes
# `dns:read` and `dns:write`; the legacy `domain` scope is refused with `not_authorized`.
# Tokens are created at https://manager.infomaniak.com/v3/infomaniak-api. Rotate the Secret
# with:
#   kubectl -n cert-manager create secret generic infomaniak-api-credentials \
#     --from-literal=api-token=<token> --dry-run=client -o yaml | kubectl apply -f -
# No restart needed; the webhook reads the Secret per request. cert-manager retries pending
# Challenges on its own.
#
# Apply: kubectl apply -f ingress/cert-manager/infomaniak-webhook.yaml
---
# Source: infomaniak-webhook/templates/namespace.yaml
apiVersion: v1
kind: Namespace
metadata:
  name: "cert-manager-infomaniak"
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
---
# Source: infomaniak-webhook/templates/rbac.yaml
apiVersion: v1
kind: ServiceAccount
metadata:
  name: infomaniak-webhook
  namespace: "cert-manager-infomaniak"
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
---
# Source: infomaniak-webhook/templates/rbac.yaml
# Grant cert-manager permission to validate using our apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: infomaniak-webhook:domain-solver
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
rules:
  - apiGroups:
      - acme.infomaniak.com
    resources:
      - '*'
    verbs:
      - 'create'
---
# Source: infomaniak-webhook/templates/rbac.yaml
# apiserver gets the auth-delegator role to delegate auth decisions to
# the core apiserver
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infomaniak-webhook:auth-delegator
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: infomaniak-webhook
    namespace: cert-manager-infomaniak
---
# Source: infomaniak-webhook/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: infomaniak-webhook:domain-solver
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: infomaniak-webhook:domain-solver
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: cert-manager
    namespace: cert-manager
# Role to access infomaniak-webhook secrets
---
# Source: infomaniak-webhook/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: infomaniak-webhook:secret-reader
  namespace: cert-manager
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
rules:
  - apiGroups: [""]
    resources:
      - 'secrets'
    resourceNames:
      - "infomaniak-api-credentials"
    verbs:
      - 'get'
      - 'watch'
      - 'list'
# Allow infomaniak-webhook ServiceAccount to read its secrets
---
# Source: infomaniak-webhook/templates/rbac.yaml
# Grant the webhook permission to read the ConfigMap containing the Kubernetes
# apiserver's requestheader-ca-certificate.
# This ConfigMap is automatically created by the Kubernetes apiserver.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infomaniak-webhook:webhook-authentication-reader
  namespace: kube-system
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: extension-apiserver-authentication-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: infomaniak-webhook
    namespace: cert-manager-infomaniak
---
# Source: infomaniak-webhook/templates/rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: infomaniak-webhook:secret-reader
  namespace: cert-manager
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: infomaniak-webhook:secret-reader
subjects:
  - apiGroup: ""
    kind: ServiceAccount
    name: infomaniak-webhook
    namespace: cert-manager-infomaniak
---
# Source: infomaniak-webhook/templates/service.yaml
apiVersion: v1
kind: Service
metadata:
  name: infomaniak-webhook
  namespace: "cert-manager-infomaniak"
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
spec:
  type: ClusterIP
  ports:
    - port: 443
      targetPort: https
      protocol: TCP
      name: https
  selector:
    app: infomaniak-webhook
    release: infomaniak-webhook
---
# Source: infomaniak-webhook/templates/deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: infomaniak-webhook
  namespace: "cert-manager-infomaniak"
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infomaniak-webhook
      release: infomaniak-webhook
  template:
    metadata:
      labels:
        app: infomaniak-webhook
        release: infomaniak-webhook
    spec:
      serviceAccountName: infomaniak-webhook
      containers:
        - name: infomaniak-webhook
          image: "ghcr.io/infomaniak/cert-manager-webhook-infomaniak:0.5.0"
          imagePullPolicy: IfNotPresent
          args:
            - --v=2
            - --tls-cert-file=/tls/tls.crt
            - --tls-private-key-file=/tls/tls.key
            - --secure-port=8443
          env:
            - name: GROUP_NAME
              value: "acme.infomaniak.com"
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /healthz
              port: https
          volumeMounts:
            - name: certs
              mountPath: /tls
              readOnly: true
          resources:
            {}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
              - ALL
            readOnlyRootFilesystem: true
            runAsGroup: 1000
            runAsNonRoot: true
            runAsUser: 1000
            seccompProfile:
              type: RuntimeDefault
      volumes:
        - name: certs
          secret:
            secretName: infomaniak-webhook-webhook-tls
---
# Source: infomaniak-webhook/templates/apiservice.yaml
apiVersion: apiregistration.k8s.io/v1
kind: APIService
metadata:
  name: v1alpha1.acme.infomaniak.com
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
  annotations:
    cert-manager.io/inject-ca-from: "cert-manager-infomaniak/infomaniak-webhook-webhook-tls"
spec:
  group: acme.infomaniak.com
  groupPriorityMinimum: 1000
  versionPriority: 15
  service:
    name: infomaniak-webhook
    namespace: cert-manager-infomaniak
  version: v1alpha1
---
# Source: infomaniak-webhook/templates/pki.yaml
# Generate a CA Certificate used to sign certificates for the webhook
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: infomaniak-webhook-ca
  namespace: "cert-manager-infomaniak"
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
spec:
  secretName: infomaniak-webhook-ca
  duration: 43800h0m0s # 5y
  issuerRef:
    name: infomaniak-webhook-selfsign
  commonName: "ca.infomaniak-webhook.cert-manager"
  isCA: true
---
# Source: infomaniak-webhook/templates/pki.yaml
# Finally, generate a serving certificate for the webhook to use
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: infomaniak-webhook-webhook-tls
  namespace: "cert-manager-infomaniak"
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
spec:
  secretName: infomaniak-webhook-webhook-tls
  duration: 8760h0m0s # 1y
  issuerRef:
    name: infomaniak-webhook-ca
  dnsNames:
  - infomaniak-webhook
  - infomaniak-webhook.cert-manager-infomaniak
  - infomaniak-webhook.cert-manager-infomaniak.svc
---
# Source: infomaniak-webhook/templates/pki.yaml
# Create a selfsigned Issuer, in order to create a root CA certificate for
# signing webhook serving certificates
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: infomaniak-webhook-selfsign
  namespace: "cert-manager-infomaniak"
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
spec:
  selfSigned: {}
---
# Source: infomaniak-webhook/templates/pki.yaml
# Create an Issuer that uses the above generated CA certificate to issue certs
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: infomaniak-webhook-ca
  namespace: "cert-manager-infomaniak"
  labels:
    app: infomaniak-webhook
    chart: infomaniak-webhook-0.5.0
    release: infomaniak-webhook
    heritage: Helm
spec:
  ca:
    secretName: infomaniak-webhook-ca
