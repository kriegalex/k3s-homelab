installCRDs: false
replicaCount: 1
extraArgs:
  - --dns01-recursive-nameservers=https://1.1.1.1/dns-query,https://8.8.8.8/dns-query
  - --dns01-recursive-nameservers-only
podDnsPolicy: None
podDnsConfig:
  nameservers:
    - 1.1.1.1
    - 8.8.8.8

prometheus:
  enabled: true
  servicemonitor:
    enabled: true
    labels:
      release: prometheus
