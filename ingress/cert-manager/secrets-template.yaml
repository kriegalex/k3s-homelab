# Secrets Template for cert-manager DNS Providers
# Copy this file to secrets.yaml and replace CHANGE_ME_* values
# IMPORTANT: Add secrets.yaml to .gitignore to prevent committing secrets

---
# Infomaniak API Token Secret
# Required for: Infomaniak DNS provider
# Get API token from: https://manager.infomaniak.com/v3/api/dashboard
apiVersion: v1
kind: Secret
metadata:
  name: infomaniak-api-credentials
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "CHANGE_ME_INFOMANIAK_API_TOKEN"

---
# Route53 AWS Credentials Secret
# Required for: AWS Route53 DNS provider
# Get credentials from: AWS IAM console
apiVersion: v1
kind: Secret
metadata:
  name: route53-secret
  namespace: cert-manager
type: Opaque
stringData:
  secret-access-key: "CHANGE_ME_AWS_SECRET_ACCESS_KEY"

---
# Cloudflare API Token Secret
# Required for: Cloudflare DNS provider
# Get API token from: https://dash.cloudflare.com/profile/api-tokens
# Required permissions: Zone:DNS:Edit for all zones
apiVersion: v1
kind: Secret
metadata:
  name: cloudflare-api-token-secret
  namespace: cert-manager
type: Opaque
stringData:
  api-token: "CHANGE_ME_CLOUDFLARE_API_TOKEN"

---
# DuckDNS Token Secret
# Required for: DuckDNS provider
# Get token from: https://www.duckdns.org/
apiVersion: v1
kind: Secret
metadata:
  name: duckdns-token-secret
  namespace: cert-manager
type: Opaque
stringData:
  token: "CHANGE_ME_DUCKDNS_TOKEN"
