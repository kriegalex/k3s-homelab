controller:
  # -- This configuration defines if Ingress Controller should allow users to set
  # their own *-snippet annotations, otherwise this is forbidden / dropped
  # when users add those annotations.
  # Global snippets in ConfigMap are still respected
  allowSnippetAnnotations: true

  # https://github.com/kubernetes/ingress-nginx/issues/12634
  # Since ingress-nginx v1.12.0:
  # https://github.com/kubernetes/ingress-nginx/releases/tag/controller-v1.12.0
  # https://github.com/kubernetes/ingress-nginx/pull/11819
  # Disable when not using nextcloud, see nextcloud annotations
  config:
    annotations-risk-level: Critical

  service:
    # -- External traffic policy of the external controller service. Set to "Local" to preserve source IP on providers supporting it.
    # Ref: https://kubernetes.io/docs/tasks/access-application-cluster/create-external-load-balancer/#preserving-the-client-source-ip
    externalTrafficPolicy: "Local"
