# alertmanager-ntfy bridge — chart: oci://codeberg.org/wrenix/helm-charts/alertmanager-ntfy v0.1.9
# Receives Alertmanager webhooks, formats them, POSTs to a ntfy topic.
# Only fields that differ from upstream defaults are listed here; run:
#   helm show values oci://codeberg.org/wrenix/helm-charts/alertmanager-ntfy --version 0.1.9
# for the full effective config.
#
# IMPORTANT: ntfy credentials live in a separate gitignored values file
# (`helm-values-secret.yaml` in this folder — template in secrets-template.yaml)
# because the chart renders them directly into a Secret from .Values
# (no envFrom path is exposed). Install with both files:
#
#   kubectl create namespace ntfy   # shared with the ntfy server
#   helm upgrade --install alertmanager-ntfy \
#     oci://codeberg.org/wrenix/helm-charts/alertmanager-ntfy \
#     --version 0.1.9 -n ntfy \
#     -f values.yaml -f helm-values-secret.yaml

image:
  registry: docker.io          # chart default (codeberg.org) has no versioned tags; Docker Hub has them
  repository: xenrox/ntfy-alertmanager
  tag: "1.0.0"                 # latest; chart appVersion is 0.4.0 but that tag doesn't exist on codeberg

# KNOWN ISSUE — liveness/readiness probes (chart v0.1.9 bug):
# The chart hardcodes httpGet GET / for both probes. ntfy-alertmanager correctly
# returns 405 for non-POST requests, so Kubernetes kills the pod on every probe.
# The chart does not expose probe overrides in .Values, so this cannot be fixed
# via values alone. After every helm upgrade, re-apply the TCP socket patch:
#
#   kubectl --context=default -n ntfy patch deployment alertmanager-ntfy \
#     --type=json -p='[
#       {"op":"replace","path":"/spec/template/spec/containers/0/livenessProbe",
#        "value":{"tcpSocket":{"port":80},"initialDelaySeconds":5,"periodSeconds":10,"failureThreshold":3}},
#       {"op":"replace","path":"/spec/template/spec/containers/0/readinessProbe",
#        "value":{"tcpSocket":{"port":80},"initialDelaySeconds":5,"periodSeconds":5,"failureThreshold":3}}
#     ]'
#
# When a fixed chart is released, remove this comment and the post-upgrade step.

ntfyAlertmanager:
  ntfy:
    # Publish to the in-cluster ntfy service — no need to round-trip
    # through the public Ingress for cluster-internal traffic.
    # ntfy.user and ntfy.password come from helm-values-secret.yaml.
    topic: http://ntfy.ntfy.svc.cluster.local/homelab-k3s

  # Severity → priority + emoji tag mapping. Aligned with the route tree
  # documented in claude-docs/backup-strategy.md §8.2 (critical/warning/info).
  labels:
    order:
      - severity
      - alertname
    entries:
      - label: severity
        value: critical
        priority: 5
        tags: ["rotating_light"]
      - label: severity
        value: warning
        priority: 3
        tags: ["warning"]
      - label: severity
        value: info
        priority: 1
        tags: ["information_source"]

  resolved:
    tags: ["white_check_mark"]

resources:
  requests:
    cpu: 10m
    memory: 16Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Colocate with the rest of the monitoring stack.
affinity:
  nodeAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        preference:
          matchExpressions:
            - key: kubernetes.io/hostname
              operator: In
              values:
                - k3s-worker4
