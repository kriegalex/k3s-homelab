# Template for `helm-values-secret.yaml` (gitignored — see .gitignore line 13).
#
# The wrenix/alertmanager-ntfy chart renders the bridge configuration
# (including ntfy credentials) into a Helm-managed Secret directly from
# .Values. There is no envFrom / external-secret hook exposed, so to keep
# credentials out of git we layer this fragment via a second `-f`:
#
#   cp secrets-template.yaml helm-values-secret.yaml
#   # ...edit credentials below...
#   helm upgrade --install alertmanager-ntfy \
#     oci://codeberg.org/wrenix/helm-charts/alertmanager-ntfy \
#     --version 0.1.9 -n ntfy \
#     -f values.yaml -f helm-values-secret.yaml
#
# This file is NOT a Kubernetes Secret manifest — it's a Helm values
# fragment. It is named secrets-template.yaml only to match the repo's
# convention for committable credential templates (whitelisted by
# `!**/secrets-template.yaml` in .gitignore).
ntfyAlertmanager:
  ntfy:
    # Account scoped read-write to the homelab-* topic prefix on the ntfy
    # server (created in monitoring/ntfy/README.md §3 "Create users").
    user: homelab-publisher
    password: CHANGE_ME_PUBLISHER_PASSWORD
