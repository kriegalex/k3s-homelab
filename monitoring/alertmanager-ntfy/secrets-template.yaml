# Procedure + credential template for the `alertmanager-ntfy-config` Secret
# (referenced by `ntfyAlertmanager.existingSecret` in values.yaml since chart
# 0.3.0). The Secret holds the COMPLETE rendered bridge config; committed
# values.yaml stays the source for everything except the credentials.
#
# To (re)generate the Secret after editing values.yaml or rotating creds:
#
#   # 1. Render config + template from committed values + the credentials
#   #    (temporarily overriding existingSecret so the chart renders them):
#   helm template alertmanager-ntfy k8s-charts/alertmanager-ntfy \
#     --version 0.3.0 -n ntfy -f values.yaml \
#     --set ntfyAlertmanager.existingSecret="" \
#     --set ntfyAlertmanager.ntfy.user='homelab-publisher' \
#     --set ntfyAlertmanager.ntfy.password='CHANGE_ME_PUBLISHER_PASSWORD' \
#     -s templates/secret.yaml > /tmp/amntfy-secret.yaml
#   yq -r '.stringData.config' /tmp/amntfy-secret.yaml > /tmp/amntfy-config
#   yq -r '.stringData["template.tmpl"]' /tmp/amntfy-secret.yaml > /tmp/amntfy-template.tmpl
#
#   # 2. Replace the Secret and restart the bridge:
#   kubectl -n ntfy create secret generic alertmanager-ntfy-config \
#     --from-file=config=/tmp/amntfy-config \
#     --from-file=template.tmpl=/tmp/amntfy-template.tmpl \
#     --dry-run=client -o yaml | kubectl -n ntfy apply -f -
#   kubectl -n ntfy rollout restart deployment alertmanager-ntfy
#   rm /tmp/amntfy-secret.yaml /tmp/amntfy-config /tmp/amntfy-template.tmpl
#
# Credentials (never committed): the ntfy publisher account is scoped
# read-write to the homelab-* topic prefix (created in
# monitoring/ntfy/README.md §3 "Create users"):
#   user:     homelab-publisher
#   password: CHANGE_ME_PUBLISHER_PASSWORD
