---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: backup-alerts
  namespace: monitoring
  labels:
    release: prometheus
spec:
  groups:
    - name: backup-recency
      interval: 5m
      rules:
        - alert: CNPGBackupStale
          expr: |
            (time() - max by (job) (cnpg_collector_last_available_backup_timestamp)) > 129600
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "CNPG cluster {{ $labels.job }} has no recent backup"
            description: "Last successful backup is {{ $value | humanizeDuration }} old (threshold 36h)."

        - alert: LonghornBackupFailed
          expr: longhorn_backup_state == 4   # 4 = error (0=New 1=Pending 2=InProgress 3=Completed 4=Error 5=Unknown)
          for: 15m
          labels:
            severity: warning
          annotations:
            summary: "Longhorn backup failed for {{ $labels.volume }}"
            description: "Backup task {{ $labels.backup }} on volume {{ $labels.volume }} is in error state."

        - alert: QNAPBackupVolumeLow
          expr: |
            (node_filesystem_avail_bytes{mountpoint="/mnt/qnap-backup"} 
             / node_filesystem_size_bytes{mountpoint="/mnt/qnap-backup"}) < 0.10
          for: 30m
          labels:
            severity: warning
          annotations:
            summary: "QNAP /backup mount has < 10% free"
            description: "Free space on /mnt/qnap-backup is {{ $value | humanizePercentage }}."