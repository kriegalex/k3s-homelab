## Using default values from https://github.com/grafana/helm-charts/blob/main/charts/grafana/values.yaml
##
grafana:
  enabled: true
  assertNoLeakedSecrets: true  # Enable secret leak detection
  defaultDashboardsEnabled: false
  defaultDashboardsTimezone: "Europe/Zurich"

  # Use existing Kubernetes secret for admin credentials
  admin:
    existingSecret: grafana-admin-credentials
    userKey: admin-user
    passwordKey: admin-password

  # OAuth/SSO Configuration (optional)
  # Uncomment and configure for OAuth integration (Authentik, Keycloak, etc.)
  # grafana.ini:
  #   auth:
  #     signout_redirect_url: https://auth.example.com
  #     oauth_auto_login: true
  #   auth.generic_oauth:
  #     name: Authentik
  #     enabled: true
  #     client_id: "grafana-client-id"
  #     client_secret: "YOUR_CLIENT_SECRET"  # Store in secrets.yaml
  #     scopes: "openid profile email"
  #     auth_url: "https://auth.example.com/application/o/authorize/"
  #     token_url: "https://auth.example.com/application/o/token/"
  #     api_url: "https://auth.example.com/application/o/userinfo/"
  #   server:
  #     root_url: "https://grafana.example.com"

  affinity:
    nodeAffinity:
      preferredDuringSchedulingIgnoredDuringExecution:
        - weight: 100
          preference:
            matchExpressions:
              - key: kubernetes.io/hostname
                operator: In
                values:
                  - k3s-worker4

  ingress:
    enabled: true
    ingressClassName: traefik
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod

    hosts:
      - grafana.homelab.example.com

    ## Path for grafana ingress
    path: /

    ## TLS configuration for grafana Ingress
    ## Secret must be manually created in the namespace
    ##
    tls:
    - secretName: grafana-general-tls
      hosts:
      - grafana.homelab.example.com
  
  persistence:
    enabled: true
    type: pvc
    storageClassName: longhorn-single-replica
    size: 5Gi
    accessModes: [ReadWriteOnce]

  # Sidecar dashboard auto-import (kiwigrid/k8s-sidecar).
  # Watches ConfigMaps with label `grafana_dashboard: "1"` cluster-wide.
  # `folderAnnotation` + `foldersFromFilesStructure` make the sidecar honor
  # the `grafana_folder: <name>` annotation on each ConfigMap, so dashboards
  # can land in the Homelab folder alongside the Helm-provisioned ones.
  # Used by: monitoring/intel-gpu/dashboard.yaml.
  sidecar:
    dashboards:
      enabled: true
      folderAnnotation: grafana_folder
      provider:
        foldersFromFilesStructure: true

  # Provision dashboards from multiple folders
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'grafana-dashboards-kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
      - name: 'homelab'
        orgId: 1
        folder: 'Homelab'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/homelab
  dashboards:
    grafana-dashboards-kubernetes:
      k8s-system-api-server:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
        token: ''
      k8s-system-coredns:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
        token: ''
      k8s-views-global:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
        token: ''
      k8s-views-namespaces:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
        token: ''
      k8s-views-nodes:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
        token: ''
      k8s-views-pods:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
        token: ''
    homelab:
      # Host-level metrics from node-exporter (CPU, mem, disk, net, temp)
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus
      # CloudNativePG cluster overview (covers all 5 Postgres clusters)
      # Requires: monitoring.enablePodMonitor=true on each Cluster
      cloudnative-pg:
        url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/main/charts/cluster/grafana-dashboard.json
        token: ''
      # Longhorn storage (volume health, replicas, IOPS)
      # Requires: ServiceMonitor for longhorn-manager
      longhorn:
        gnetId: 16888
        revision: 11
        datasource: Prometheus
      # Traefik (request rate, latency, 5xx, entrypoint stats)
      # Requires: metrics.prometheus.enabled=true + ServiceMonitor on the
      # traefik release (see ingress/traefik/values.yaml).
      traefik:
        gnetId: 17347
        revision: 9
        datasource: Prometheus
      # cert-manager certificates (expiry, renewals)
      # Requires: ServiceMonitor for cert-manager :9402
      cert-manager:
        gnetId: 20842
        revision: 3
        datasource: Prometheus
      # Alertmanager (alert volume, silences) — already scraped by default
      alertmanager:
        gnetId: 9578
        revision: 4
        datasource: Prometheus
      # PVC capacity / inode usage across all storage classes
      kubernetes-pvc:
        gnetId: 13646
        revision: 2
        datasource: Prometheus
      backup-overview:
        json: ""   # populated at install time by --set-file

prometheus:
  enabled: true
  prometheusSpec:
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k3s-worker4

alertmanager:
  enabled: true
  alertmanagerSpec:
    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: kubernetes.io/hostname
                  operator: In
                  values:
                    - k3s-worker4

  config:
    global:
      resolve_timeout: 5m
    route:
      receiver: ntfy
      # In multi alertMode (set in monitoring/alertmanager-ntfy/values.yaml),
      # the ntfy bridge sends one push per Alertmanager group. Grouping by
      # alertname + namespace batches alert storms (e.g. multiple Longhorn
      # volumes failing) into a single notification listing each alert,
      # instead of one push per affected volume.
      group_by: [alertname, namespace]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      routes:
        - matchers: [alertname = "Watchdog"]
          receiver: "null"
        - matchers: [severity = "info"]
          receiver: "null"
        - matchers: [severity = "critical"]
          receiver: ntfy
          repeat_interval: 1h         # critical re-pages every hour
    receivers:
      - name: "null"
      - name: ntfy
        webhook_configs:
          - url: http://alertmanager-ntfy.ntfy.svc.cluster.local/
            send_resolved: true

# k3s embeds kube-proxy, controller-manager, and scheduler in a single binary
# without separate /metrics endpoints, so these scrape targets are always down.
kubeProxy:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
