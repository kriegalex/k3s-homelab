---
# ntfy admin bootstrap credentials.
#
# ntfy stores its user database in a SQLite file (`user.db`) on the PVC, NOT
# in a Kubernetes Secret. We therefore don't materialize the auth DB itself
# here — instead this Secret carries the *initial admin password* that we use
# once, via `ntfy user add`, after the first pod is running.
#
# Workflow:
#   1. Generate a strong password:        openssl rand -base64 24
#   2. Replace CHANGE_ME below.
#   3. Apply this template:               kubectl apply -f secrets-template.yaml
#   4. Run the bootstrap command in README §3 ("Create users") which reads
#      this Secret as an env var and calls `ntfy user add`.
#   5. Once user.db has the admin user, you can either keep this Secret around
#      for future runs of the bootstrap job, or delete it.
#
# This file is committed as a template (placeholders only). The real values
# live in a sibling `ntfy-secrets.yaml` which is gitignored by
# **/*-secrets.yaml in .gitignore.
apiVersion: v1
kind: Secret
metadata:
  name: ntfy-bootstrap
  namespace: ntfy
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_ME_STRONG_PASSWORD"
  # Publisher account used by Alertmanager-ntfy, Unraid agent, and the SMTP
  # bridge for QNAP. Scoped read-write to the `homelab-*` topic prefix —
  # see README §3.
  publisher-user: "homelab-publisher"
  publisher-password: "CHANGE_ME_PUBLISHER_PASSWORD"
---
# Web-push contact e-mail (PII — kept out of git). Injected via the chart's
# `envFrom` (see values.yaml); ntfy env vars override server.yml, so the
# placeholder emailAddress in values.yaml never reaches clients.
#
#   kubectl -n ntfy create secret generic ntfy-web-push-email \
#     --from-literal=NTFY_WEB_PUSH_EMAIL_ADDRESS='CHANGE_ME_EMAIL'
#
apiVersion: v1
kind: Secret
metadata:
  name: ntfy-web-push-email
  namespace: ntfy
type: Opaque
stringData:
  NTFY_WEB_PUSH_EMAIL_ADDRESS: CHANGE_ME_EMAIL
