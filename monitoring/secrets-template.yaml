# Monitoring (Grafana) Secrets Template
#
# INSTRUCTIONS:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Update all CHANGE_ME placeholders
# 3. Apply: kubectl apply -f secrets.yaml
# 4. Add secrets.yaml to .gitignore (DO NOT COMMIT)

---
# Grafana Admin Credentials (Required)
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin-credentials
  namespace: monitoring
type: Opaque
stringData:
  admin-user: "admin"
  admin-password: "CHANGE_ME_GRAFANA_PASSWORD"  # Use: openssl rand -base64 32

---
# OAuth/SSO Credentials (Optional - only if using OAuth)
# Uncomment and configure if you enabled OAuth in custom-values.yaml
# apiVersion: v1
# kind: Secret
# metadata:
#   name: grafana-oauth-credentials
#   namespace: monitoring
# type: Opaque
# stringData:
#   client-secret: "CHANGE_ME_OAUTH_CLIENT_SECRET"  # From your OAuth provider
