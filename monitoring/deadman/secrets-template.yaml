# Dead-man's switch Secrets — TEMPLATE. Ping URLs and the API key act as
# credentials; create the real Secrets with kubectl, never commit them.
#
#   kubectl -n monitoring create secret generic deadman-heartbeat \
#     --from-literal=url='http://10.0.0.50:8000/ping/<watchdog-check-uuid>'
#   kubectl -n monitoring create secret generic deadman-metrics \
#     --from-literal=token='<read-only API key of the Healthchecks project>'
#   kubectl -n backup create secret generic backup-heartbeats \
#     --from-literal=HC_DATA_URL='http://10.0.0.50:8000/ping/<data-check-uuid>' \
#     --from-literal=HC_CLUSTER_URL='http://10.0.0.50:8000/ping/<cluster-check-uuid>'
---
apiVersion: v1
kind: Secret
metadata:
  name: deadman-heartbeat       # mounted into Alertmanager (alertmanagerSpec.secrets)
  namespace: monitoring
stringData:
  url: "http://10.0.0.50:8000/ping/CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: deadman-metrics         # bearer token for the ScrapeConfig in scrape-and-alerts.yaml
  namespace: monitoring
stringData:
  token: "CHANGE_ME"
---
apiVersion: v1
kind: Secret
metadata:
  name: backup-heartbeats       # envFrom (optional) in both backup/exoscale-s3 CronJobs
  namespace: backup
stringData:
  HC_DATA_URL: "http://10.0.0.50:8000/ping/CHANGE_ME"
  HC_CLUSTER_URL: "http://10.0.0.50:8000/ping/CHANGE_ME"
