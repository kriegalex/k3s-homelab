# Standalone overlay: Grafana dashboard provisioning only.
# Apply with:
#   helm upgrade prometheus prometheus-community/kube-prometheus-stack \
#     -n monitoring -f monitoring/values.yaml -f monitoring/grafana-dashboards.yaml \
#     --version 63.1.0
#
# This file mirrors the `grafana.dashboardProviders` and `grafana.dashboards`
# sections of values.yaml so the dashboard set can be iterated on / re-applied
# independently of the rest of the stack config. Keep in sync with values.yaml.

grafana:
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
      - name: 'grafana-dashboards-kubernetes'
        orgId: 1
        folder: 'Kubernetes'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/grafana-dashboards-kubernetes
      - name: 'homelab'
        orgId: 1
        folder: 'Homelab'
        type: file
        disableDeletion: true
        editable: true
        options:
          path: /var/lib/grafana/dashboards/homelab
  dashboards:
    grafana-dashboards-kubernetes:
      k8s-system-api-server:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-api-server.json
        token: ''
      k8s-system-coredns:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-system-coredns.json
        token: ''
      k8s-views-global:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-global.json
        token: ''
      k8s-views-namespaces:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-namespaces.json
        token: ''
      k8s-views-nodes:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-nodes.json
        token: ''
      k8s-views-pods:
        url: https://raw.githubusercontent.com/dotdc/grafana-dashboards-kubernetes/master/dashboards/k8s-views-pods.json
        token: ''
    homelab:
      # Host-level metrics from node-exporter (CPU, mem, disk, net, temp)
      node-exporter-full:
        gnetId: 1860
        revision: 45
        datasource: Prometheus
      # CloudNativePG cluster overview (covers all 5 Postgres clusters)
      # Requires: monitoring.enablePodMonitor=true on each Cluster
      cloudnative-pg:
        url: https://raw.githubusercontent.com/cloudnative-pg/grafana-dashboards/main/charts/cluster/grafana-dashboard.json
        token: ''
      # Longhorn storage (volume health, replicas, IOPS)
      # Requires: ServiceMonitor for longhorn-manager
      longhorn:
        gnetId: 16888
        revision: 11
        datasource: Prometheus
      # Traefik (request rate, latency, 5xx, entrypoint stats)
      # Requires: metrics.prometheus.enabled=true + ServiceMonitor on the
      # traefik release (see ingress/traefik/values.yaml).
      traefik:
        gnetId: 17347
        revision: 9
        datasource: Prometheus
      # cert-manager certificates (expiry, renewals)
      # Requires: ServiceMonitor for cert-manager :9402
      cert-manager:
        gnetId: 20842
        revision: 3
        datasource: Prometheus
      # Alertmanager (alert volume, silences) — already scraped by default
      alertmanager:
        gnetId: 9578
        revision: 4
        datasource: Prometheus
      # PVC capacity / inode usage across all storage classes
      kubernetes-pvc:
        gnetId: 13646
        revision: 2
        datasource: Prometheus
