# Bitcoin Stack Secrets Template
#
# IMPORTANT: This is a template file. DO NOT commit actual secrets to git.
#
# Usage:
# 1. Copy this file: cp secrets-template.yaml secrets.yaml
# 2. Generate secure passwords:
#    - Bitcoin RPC: openssl rand -base64 24
#    - Mempool DB: openssl rand -base64 32
# 3. Replace the placeholder values below
# 4. Add secrets.yaml to .gitignore (already done in root .gitignore)
# 5. Apply: kubectl apply -f secrets.yaml

---
# Bitcoin Core RPC Credentials
apiVersion: v1
kind: Secret
metadata:
  name: bitcoin-rpc-secret
  namespace: bitcoin
type: Opaque
stringData:
  rpc-username: bitcoinrpc
  rpc-password: REPLACE_WITH_SECURE_PASSWORD  # Generate with: openssl rand -base64 24

---
# Mempool Database Credentials (only needed if mempool.enabled: true)
#
# WARNING: The bitcoin-stack chart does not yet support existingSecret for database credentials.
# These secrets are provided for future use when the chart is updated.
# Currently, you must set credentials directly in values.yaml (mempool.db.auth.*)
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: mempool-db-secret
#   namespace: bitcoin
# type: Opaque
# stringData:
#   database: mempool
#   username: mempool
#   password: REPLACE_WITH_SECURE_PASSWORD  # Generate with: openssl rand -base64 32
#   root-password: REPLACE_WITH_SECURE_ROOT_PASSWORD  # Generate with: openssl rand -base64 32

---
# Optional: Basic Auth for Bitcoin RPC Ingress
# Uncomment if you want to add basic authentication to the RPC ingress
# Generate with: htpasswd -c auth bitcoinrpc
#
# apiVersion: v1
# kind: Secret
# metadata:
#   name: bitcoin-basic-auth
#   namespace: bitcoin
# type: Opaque
# data:
#   auth: |
#     Ym9pdGNvaW5ycGM6JGFwcjEkZXhhbXBsZSRleGFtcGxlaGFzaGV4YW1wbGU=  # REPLACE
