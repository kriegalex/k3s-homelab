# deltabadger — chart: k8s-charts/deltabadger v1.0.0 (bjw-s common library)
# Real deployed values (source of truth for `helm upgrade -f values.yaml`).
controllers:
  deltabadger:
    containers:
      app:
        env:
          APP_ROOT_URL: https://badger.lourenco.ch
          HOME_PAGE_URL: https://badger.lourenco.ch
          RAILS_ASSUME_SSL: "true"
        envFrom:
        - secretRef:
            name: deltabadger-secrets
        image:
          pullPolicy: Always
          tag: latest
        resources:
          limits:
            cpu: 500m
            memory: 2Gi
          requests:
            cpu: 150m
            memory: 1Gi
    replicas: 1
ingress:
  app:
    annotations:
      cert-manager.io/cluster-issuer: letsencrypt-prod
      traefik.ingress.kubernetes.io/router.middlewares: traefik-redirect-https@kubernetescrd
    className: traefik
    enabled: true
    hosts:
    - host: badger.lourenco.ch
      paths:
      - path: /
        pathType: Prefix
        service:
          identifier: app
          port: http
    tls:
    - hosts:
      - badger.lourenco.ch
      secretName: deltabadger-tls
persistence:
  storage:
    enabled: true
    size: 50Gi
    storageClass: longhorn
secrets:
  secrets:
    enabled: false
service:
  app:
    type: ClusterIP
